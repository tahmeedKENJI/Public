<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>netviz3d</title>
<!--GRAPH_INJECT-->
<style>
:root{
  --bg:#0d1117; --bg2:#131a24; --panel:#161d28; --panel2:#1c2532; --line:#26303d;
  --ink:#e6edf3; --ink2:#9aa8b8; --ink3:#63718a; --accent:#58a6ff; --warn:#f0a04b;
  --shadow:0 8px 32px rgba(0,0,0,.45);
  --fam-conv:#4d8bf0; --fam-norm:#2fc9a5; --fam-activation:#f5a623; --fam-pool:#a06cf0;
  --fam-linear:#f0628f; --fam-embedding:#7ed957; --fam-attention:#c77dff; --fam-recurrent:#4cc9f0;
  --fam-regular:#7d8899; --fam-shape:#5d6b80; --fam-merge:#ff8a65; --fam-upsample:#9ccc65;
  --fam-io:#c9d4e2; --fam-misc:#7d8899;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font:13px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2b3747;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#3a4a5e}
::-webkit-scrollbar-track{background:transparent}

#app{display:grid;grid-template-columns:250px 1fr 360px;grid-template-rows:46px 1fr;height:100%}
#top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
#brand{font-weight:650;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
#brand b{color:var(--accent)}
.badge{font-size:10.5px;padding:2.5px 7px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.badge.hi{color:var(--accent);border-color:#24405f;background:#132133}
#stats{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;overflow:hidden}
.stat{font-size:11px;color:var(--ink2);white-space:nowrap}
.stat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
#right{border-right:none;border-left:1px solid var(--line);grid-column:3}
h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink3);
  margin:16px 0 7px;font-weight:650}
h4:first-child{margin-top:2px}

#search{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:7px 9px;font-size:12px;outline:none}
#search:focus{border-color:var(--accent)}
#list{margin-top:8px;max-height:34vh;overflow-y:auto;border:1px solid var(--line);border-radius:7px}
.li{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;font-size:11.5px;
  border-bottom:1px solid #1b2430;white-space:nowrap;overflow:hidden}
.li:last-child{border-bottom:none}
.li:hover{background:var(--panel2)}
.li.sel{background:#1d3149}
.li .dot{width:8px;height:8px;border-radius:2px;flex:none}
.li .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.li .ty{color:var(--ink3);font-size:10px;flex:none}

.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0;font-size:12px}
.ctl label{color:var(--ink2);cursor:pointer}
.sw{position:relative;width:30px;height:17px;background:#2b3747;border-radius:99px;
  transition:.15s;flex:none;cursor:pointer}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;
  background:#8d9bb0;transition:.15s}
.sw.on{background:#1f4b7a}.sw.on::after{background:var(--accent);transform:translateX(13px)}
input[type=range]{width:110px;accent-color:var(--accent);background:transparent}
select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px;
  font-size:11.5px;outline:none}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;
  font-size:11.5px;color:var(--ink2);transition:.12s}
.btn:hover{border-color:#39485c;color:var(--ink)}
.btn.pri{background:#17395e;border-color:#245285;color:#cfe4ff;width:100%;padding:9px;
  font-weight:600;font-size:12.5px;margin-top:12px}
.btn.pri:hover{background:#1d4877}
.row{display:flex;gap:6px;flex-wrap:wrap}

#legend{display:flex;flex-direction:column;gap:3px}
.lg{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink2);cursor:pointer;
  padding:2px 4px;border-radius:4px}
.lg:hover{background:var(--panel2)}
.lg.off{opacity:.35}
.lg i{width:10px;height:10px;border-radius:2px;flex:none}
.lg span:last-child{margin-left:auto;color:var(--ink3);font-variant-numeric:tabular-nums}

#stage{position:relative;overflow:hidden;background:
  radial-gradient(ellipse 80% 60% at 50% 0%,#16202e 0%,var(--bg) 70%)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas.drag{cursor:grabbing}
#tip{position:absolute;pointer-events:none;background:#0b1017f2;border:1px solid #31415a;
  border-radius:8px;padding:8px 10px;max-width:330px;font-size:11.5px;box-shadow:var(--shadow);
  opacity:0;transition:opacity .1s;z-index:20;backdrop-filter:blur(3px)}
#tip.on{opacity:1}
#tip .t{font-weight:650;margin-bottom:2px}
#tip .s{color:var(--ink3);font-variant-numeric:tabular-nums;font-size:10.5px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#tip .d{color:var(--ink2);margin-top:5px;line-height:1.45}
#hint{position:absolute;left:12px;bottom:10px;font-size:10.5px;color:var(--ink3);
  pointer-events:none;line-height:1.7}
#hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:0 4px;font:inherit;font-size:10px}
#axis{position:absolute;right:12px;bottom:10px;font-size:10px;color:var(--ink3);text-align:right;
  pointer-events:none;line-height:1.6}

#right .empty{color:var(--ink3);font-size:12px;text-align:center;padding:40px 16px;line-height:1.7}
#dt .hd{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
#dt .op{font-size:17px;font-weight:650;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
#dt .op i{width:11px;height:11px;border-radius:3px;flex:none}
#dt .pth{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink3);
  margin-top:3px;word-break:break-all}
.shp{display:flex;align-items:center;gap:8px;margin:9px 0;font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;
  flex-wrap:wrap}
.shp code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 7px;
  color:var(--ink)}
.shp code.asm{border-style:dashed;color:var(--ink2)}
.shp .ar{color:var(--ink3)}
.mets{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}
.met{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px}
.met .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.met .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:1px}
.met .b{height:3px;background:#212b38;border-radius:2px;margin-top:5px;overflow:hidden}
.met .b i{display:block;height:100%;background:var(--accent);border-radius:2px}
.sec{margin-top:14px}
.sec .st{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);
  margin-bottom:4px;font-weight:650;display:flex;align-items:center;gap:6px}
.sec .st::after{content:"";flex:1;height:1px;background:var(--line)}
.sec p{color:var(--ink2);line-height:1.62;font-size:12.2px}
.sec p+p{margin-top:7px}
.sec p em{color:var(--ink);font-style:normal;font-weight:600}
.hyp{margin-top:6px}
.hyp .h{border-left:2px solid #2c3a4d;padding:3px 0 3px 9px;margin-bottom:7px}
.hyp .h b{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);font-weight:500}
.hyp .h b span{color:var(--ink)}
.hyp .h div{color:var(--ink2);font-size:11.6px;line-height:1.55;margin-top:2px}
.warns{margin-top:6px}
.warns li{list-style:none;color:var(--ink2);font-size:11.6px;line-height:1.55;
  padding-left:15px;position:relative;margin-bottom:6px}
.warns li::before{content:"▲";position:absolute;left:0;top:0;color:var(--warn);font-size:8px;top:3px}
.conn{margin-top:6px}
.conn .c{display:flex;gap:7px;align-items:baseline;font-size:11.5px;padding:3px 0;
  border-bottom:1px solid #1b2430;cursor:pointer}
.conn .c:hover{color:var(--accent)}
.conn .c .k{font-size:9.5px;text-transform:uppercase;color:var(--ink3);flex:none;width:62px}
.conn .c .n{font:11px ui-monospace,Menlo,monospace;overflow:hidden;text-overflow:ellipsis}

#note{position:absolute;left:0;right:0;top:0;background:#1a1408e6;border-bottom:1px solid #453413;
  padding:7px 14px;font-size:11.3px;color:#e3c38a;display:none;line-height:1.5;max-height:26%;
  overflow-y:auto;z-index:6}
#note.on{display:block}
#note b{color:#ffd89b}
#note button{float:right;color:#a3865a;font-size:15px;line-height:1;padding:0 4px;margin-left:8px}

#modal{position:fixed;inset:0;background:#080b10;z-index:50;display:none;
  grid-template-rows:52px 1fr auto;backdrop-filter:blur(4px)}
#modal.on{display:grid}
#mhd{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);
  background:var(--panel)}
#mhd .ti{font-size:15px;font-weight:650}
#mhd .sb{font-size:11.5px;color:var(--ink3)}
#mhd .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
#mcv{position:relative;overflow:hidden}
#mfoot{background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;
  display:flex;gap:16px;align-items:flex-start;max-height:30vh}
#mcap{flex:1;font-size:12.3px;color:var(--ink2);line-height:1.6}
#mcap b{color:var(--ink)}
#mcap .step{color:var(--accent);font-weight:600}
#mctl{display:flex;gap:7px;align-items:center;flex:none}
.close{font-size:20px;line-height:1;color:var(--ink3);padding:2px 8px}
.close:hover{color:var(--ink)}
#loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;color:var(--ink3);font-size:13px;text-align:center;padding:30px}
#loader code{background:var(--panel2);padding:2px 6px;border-radius:5px;color:var(--ink2);
  font-size:11.5px}
@media(max-width:1180px){#app{grid-template-columns:210px 1fr 300px}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="brand"><b>netviz3d</b></div>
    <span class="badge hi" id="b-fw">—</span>
    <span class="badge" id="b-fmt">—</span>
    <div id="stats"></div>
  </div>

  <aside id="left">
    <h4>Layers</h4>
    <input id="search" placeholder="Filter layers…" autocomplete="off">
    <div id="list"></div>

    <h4>View</h4>
    <div class="ctl"><label for="c-lab">Labels</label><div class="sw on" id="c-lab"></div></div>
    <div class="ctl"><label for="c-arr">Connections</label><div class="sw on" id="c-arr"></div></div>
    <div class="ctl"><label for="c-grid">Ground grid</label><div class="sw on" id="c-grid"></div></div>
    <div class="ctl"><label for="c-ortho">Orthographic</label><div class="sw" id="c-ortho"></div></div>
    <div class="ctl"><label>Spacing</label><input type="range" id="c-gap" min="6" max="70" value="20"></div>
    <div class="ctl"><label>Colour by</label>
      <select id="c-color">
        <option value="family">Layer type</option>
        <option value="params">Parameter count</option>
        <option value="macs">Compute cost</option>
        <option value="depth">Depth in network</option>
      </select></div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="c-fit">Fit view</button>
      <button class="btn" id="c-side">Side</button>
      <button class="btn" id="c-iso">Iso</button>
      <button class="btn" id="c-top">Top</button>
    </div>

    <h4>Legend</h4>
    <div id="legend"></div>
  </aside>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="hint">
      <div><kbd>drag</kbd> orbit · <kbd>shift</kbd>+drag pan · <kbd>wheel</kbd> zoom</div>
      <div><kbd>click</kbd> select · <kbd>E</kbd> expand · <kbd>F</kbd> fit · <kbd>←</kbd><kbd>→</kbd> step</div>
    </div>
    <div id="axis"></div>
    <div id="loader">loading model…</div>
    <div id="note"></div>
  </div>

  <aside id="right">
    <div id="dt"><div class="empty">Click any layer to see what it does,<br>why it sits where it does,<br>and how its shape changes.</div></div>
  </aside>
</div>

<div id="modal">
  <div id="mhd">
    <div><div class="ti" id="mti">Layer</div><div class="sb" id="msb"></div></div>
    <div class="sp">
      <button class="btn" id="m-play">Pause</button>
      <button class="btn" id="m-step">Step</button>
      <button class="btn" id="m-reset">Restart</button>
      <select id="m-speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option></select>
      <button class="close" id="m-close">✕</button>
    </div>
  </div>
  <div id="mcv"><canvas id="mc"></canvas></div>
  <div id="mfoot"><div id="mcap"></div></div>
</div>

<script>
"use strict";
/* ==========================================================================
   netviz3d viewer — no dependencies, no network, nothing written to disk.
   Sections: 1 math  2 renderer  3 layout  4 interaction  5 detail panel
             6 expanded-layer scenes
   ========================================================================== */

/* ---------- 1. small 3D math ------------------------------------------ */
const V = {
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.hypot(a[0],a[1],a[2]),
  norm:a=>{const l=V.len(a)||1;return [a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

/* A camera that orbits a target. Produces view-space coords and a projection
   that can be perspective or orthographic. */
class Camera{
  constructor(){ this.target=[0,0,0]; this.yaw=1.06; this.pitch=0.30; this.dist=380;
                 this.fov=Math.PI/4; this.ortho=false; this.w=1; this.h=1; }
  eye(){
    const cp=Math.cos(this.pitch);
    return V.add(this.target,[this.dist*cp*Math.cos(this.yaw),
                              this.dist*Math.sin(this.pitch),
                              this.dist*cp*Math.sin(this.yaw)]);
  }
  update(w,h){
    this.w=w; this.h=h;
    const eye=this.eye();
    this.fwd=V.norm(V.sub(this.target,eye));
    this.rgt=V.norm(V.cross(this.fwd,[0,1,0]));
    this.up =V.cross(this.rgt,this.fwd);
    this.eyeP=eye;
    this.f=(h/2)/Math.tan(this.fov/2);
    this.oscale=(h/2)/(this.dist*Math.tan(this.fov/2));
  }
  view(p){                                     // world -> view (z = forward)
    const d=V.sub(p,this.eyeP);
    return [V.dot(d,this.rgt),V.dot(d,this.up),V.dot(d,this.fwd)];
  }
  project(v){                                  // view -> screen
    if(this.ortho){
      return [this.w/2+v[0]*this.oscale, this.h/2-v[1]*this.oscale];
    }
    const z=Math.max(v[2],0.01);
    return [this.w/2+this.f*v[0]/z, this.h/2-this.f*v[1]/z];
  }
  toScreen(p){ return this.project(this.view(p)); }
}

/* ---------- 2. renderer ------------------------------------------------ */
/* Draw items are collected, sorted back-to-front and painted onto a 2D
   canvas. Boxes are axis-aligned so a painter's sort is exact enough, and
   back faces are culled, which keeps the item count low. */

const BOXFACES=[               // [indices, normal]
  [[0,1,2,3],[0,0,-1]],[[5,4,7,6],[0,0,1]],
  [[4,0,3,7],[-1,0,0]],[[1,5,6,2],[1,0,0]],
  [[4,5,1,0],[0,-1,0]],[[3,2,6,7],[0,1,0]]
];
function boxCorners(c,s){
  const [x,y,z]=c,[a,b,d]=[s[0]/2,s[1]/2,s[2]/2];
  return [[x-a,y-b,z-d],[x+a,y-b,z-d],[x+a,y+b,z-d],[x-a,y+b,z-d],
          [x-a,y-b,z+d],[x+a,y-b,z+d],[x+a,y+b,z+d],[x-a,y+b,z+d]];
}
function parseColor(c){
  if(!c) return [125,136,153,1];
  if(c[0]==='#'){
    let h=c.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const n=parseInt(h,16);
    if(Number.isNaN(n)) return [125,136,153,1];
    return [(n>>16)&255,(n>>8)&255,n&255,1];
  }
  const m=c.match(/rgba?\(([^)]+)\)/);
  if(m){
    const q=m[1].split(',').map(x=>parseFloat(x));
    return [q[0]||0,q[1]||0,q[2]||0,q.length>3?q[3]:1];
  }
  return [125,136,153,1];
}
function shade(col,k){
  const [r,g,b,a]=parseColor(col);
  const f=v=>clamp(Math.round(v*k),0,255);
  return a>=1?`rgb(${f(r)},${f(g)},${f(b)})`:`rgba(${f(r)},${f(g)},${f(b)},${a})`;
}
const LIGHT=V.norm([-0.45,0.82,-0.36]);

class Scene{
  constructor(){ this.items=[]; }
  clear(){ this.items=[]; }
  box(center,size,color,opts={}){
    const cs=boxCorners(center,size);
    this.items.push({t:'box',cs,color,center,size,...opts});
  }
  poly(points,color,opts={}){ this.items.push({t:'poly',points,color,...opts}); }
  line(points,color,opts={}){ this.items.push({t:'line',points,color,...opts}); }
  arrow(points,color,opts={}){ this.items.push({t:'arrow',points,color,...opts}); }
  text(pos,str,opts={}){ this.items.push({t:'text',pos,str,...opts}); }
  sprite(pos,draw,opts={}){ this.items.push({t:'sprite',pos,draw,...opts}); }
}

class Renderer{
  constructor(canvas){
    this.cv=canvas; this.ctx=canvas.getContext('2d');
    this.cam=new Camera(); this.dpr=1; this.hits=[]; this.labels=[];
  }
  resize(){
    const r=this.cv.getBoundingClientRect();
    this.dpr=Math.min(window.devicePixelRatio||1,2);
    this.cv.width=Math.max(1,Math.round(r.width*this.dpr));
    this.cv.height=Math.max(1,Math.round(r.height*this.dpr));
    this.W=r.width; this.H=r.height;
  }
  draw(scene,opts={}){
    const {ctx,cam}=this; cam.update(this.W,this.H);
    ctx.setTransform(this.dpr,0,0,this.dpr,0,0);
    ctx.clearRect(0,0,this.W,this.H);
    const draws=[]; this.hits=[]; this.labels=[];

    for(const it of scene.items){
      if(it.t==='box'){
        const vs=it.cs.map(p=>cam.view(p));
        if(vs.every(v=>v[2]<=0.05)) continue;
        const ss=vs.map(v=>cam.project(v));
        let any=false;
        for(const [idx,nrm] of BOXFACES){
          const toCam=V.sub(cam.eyeP,it.center);
          if(V.dot(nrm,toCam)<=0) continue;              // back-face cull
          const pts=idx.map(i=>ss[i]);
          const depth=(vs[idx[0]][2]+vs[idx[1]][2]+vs[idx[2]][2]+vs[idx[3]][2])/4;
          if(depth<=0.05) continue;
          const k=0.55+0.45*Math.max(0,V.dot(nrm,LIGHT));
          draws.push({d:depth,kind:'face',pts,fill:shade(it.color,it.dim?k*0.5:k),
                      stroke:it.stroke,lw:it.lw,alpha:it.alpha});
          any=true;
        }
        if(any) this.hits.push({ref:it.ref,item:it,pts:ss,
          depth:Math.min(...vs.map(v=>v[2])),screen:ss});
        if(it.label!==undefined){
          const c=cam.project(cam.view(it.center));
          const vz=cam.view(it.center)[2];
          if(vz>0.05) this.labels.push({x:c[0],y:c[1],item:it,depth:vz,ss});
        }
      } else if(it.t==='poly'){
        const vs=it.points.map(p=>cam.view(p));
        if(vs.some(v=>v[2]<=0.05)) continue;
        const pts=vs.map(v=>cam.project(v));
        draws.push({d:vs.reduce((a,v)=>a+v[2],0)/vs.length,kind:'face',pts,
                    fill:it.color,stroke:it.stroke,lw:it.lw,alpha:it.alpha});
        if(it.ref) this.hits.push({ref:it.ref,item:it,pts,depth:Math.min(...vs.map(v=>v[2]))});
      } else if(it.t==='line'||it.t==='arrow'){
        const vs=it.points.map(p=>cam.view(p));
        if(vs.some(v=>v[2]<=0.05)) continue;
        const pts=vs.map(v=>cam.project(v));
        draws.push({d:vs.reduce((a,v)=>a+v[2],0)/vs.length,kind:it.t,pts,
                    stroke:it.color,lw:it.lw||1.5,alpha:it.alpha,dash:it.dash,head:it.head});
        if(it.ref) this.hits.push({ref:it.ref,item:it,line:pts,
          depth:vs.reduce((a,v)=>a+v[2],0)/vs.length});
      } else if(it.t==='text'){
        const v=cam.view(it.pos); if(v[2]<=0.05) continue;
        const p=cam.project(v);
        draws.push({d:v[2]-0.5,kind:'text',pts:[p],str:it.str,fill:it.color||'#e6edf3',
                    font:it.font||'11px ui-sans-serif,system-ui',align:it.align||'center',
                    alpha:it.alpha,bg:it.bg});
      } else if(it.t==='sprite'){
        const v=cam.view(it.pos); if(v[2]<=0.05) continue;
        const p=cam.project(v);
        draws.push({d:v[2],kind:'sprite',pts:[p],draw:it.draw,
                    scale:cam.ortho?cam.oscale:cam.f/v[2]});
      }
    }

    draws.sort((a,b)=>b.d-a.d);                      // far to near
    for(const d of draws){
      ctx.globalAlpha=d.alpha===undefined?1:d.alpha;
      if(d.kind==='face'){
        ctx.beginPath(); ctx.moveTo(d.pts[0][0],d.pts[0][1]);
        for(let i=1;i<d.pts.length;i++) ctx.lineTo(d.pts[i][0],d.pts[i][1]);
        ctx.closePath();
        if(d.fill){ctx.fillStyle=d.fill;ctx.fill();}
        if(d.stroke){ctx.strokeStyle=d.stroke;ctx.lineWidth=d.lw||1;ctx.stroke();}
      } else if(d.kind==='line'||d.kind==='arrow'){
        ctx.strokeStyle=d.stroke; ctx.lineWidth=d.lw; ctx.lineJoin='round'; ctx.lineCap='round';
        if(d.dash) ctx.setLineDash(d.dash); else ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(d.pts[0][0],d.pts[0][1]);
        for(let i=1;i<d.pts.length;i++) ctx.lineTo(d.pts[i][0],d.pts[i][1]);
        ctx.stroke(); ctx.setLineDash([]);
        if(d.kind==='arrow'&&d.head!==false){
          const n=d.pts.length,a=d.pts[n-2],b=d.pts[n-1];
          const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),s=(d.lw||1.5)*3.1+2.4;
          ctx.fillStyle=d.stroke; ctx.beginPath();
          ctx.moveTo(b[0],b[1]);
          ctx.lineTo(b[0]-s*Math.cos(ang-0.42),b[1]-s*Math.sin(ang-0.42));
          ctx.lineTo(b[0]-s*Math.cos(ang+0.42),b[1]-s*Math.sin(ang+0.42));
          ctx.closePath(); ctx.fill();
        }
      } else if(d.kind==='text'){
        ctx.font=d.font; ctx.textAlign=d.align; ctx.textBaseline='middle';
        if(d.bg){
          const w=ctx.measureText(d.str).width;
          const x=d.align==='center'?d.pts[0][0]-w/2:d.align==='right'?d.pts[0][0]-w:d.pts[0][0];
          ctx.fillStyle=d.bg; ctx.fillRect(x-4,d.pts[0][1]-8,w+8,16);
        }
        ctx.fillStyle=d.fill; ctx.fillText(d.str,d.pts[0][0],d.pts[0][1]);
      } else if(d.kind==='sprite'){
        ctx.save(); ctx.translate(d.pts[0][0],d.pts[0][1]); d.draw(ctx,d.scale); ctx.restore();
      }
    }
    ctx.globalAlpha=1;
    return draws.length;
  }
  /* front-to-back hit test */
  pick(mx,my){
    const cand=this.hits.slice().sort((a,b)=>a.depth-b.depth);
    for(const h of cand){
      if(h.pts&&pointInPoly(mx,my,h.pts)) return h.ref;
      if(h.line&&distToPolyline(mx,my,h.line)<7) return h.ref;
    }
    return null;
  }
}
function pointInPoly(x,y,pts){
  // convex hull of the projected corners is enough for an axis-aligned box
  let minx=1e9,maxx=-1e9,miny=1e9,maxy=-1e9;
  for(const p of pts){minx=Math.min(minx,p[0]);maxx=Math.max(maxx,p[0]);
                      miny=Math.min(miny,p[1]);maxy=Math.max(maxy,p[1]);}
  return x>=minx&&x<=maxx&&y>=miny&&y<=maxy;
}
function distToPolyline(x,y,pts){
  let best=1e9;
  for(let i=0;i<pts.length-1;i++){
    const [x1,y1]=pts[i],[x2,y2]=pts[i+1];
    const dx=x2-x1,dy=y2-y1,L=dx*dx+dy*dy;
    let t=L?((x-x1)*dx+(y-y1)*dy)/L:0; t=clamp(t,0,1);
    best=Math.min(best,Math.hypot(x-(x1+t*dx),y-(y1+t*dy)));
  }
  return best;
}

/* ---------- formatting helpers ---------------------------------------- */
function fmt(n){
  if(n==null) return '—';
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(2)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}
function shapeStr(s){ return s?('('+s.map(x=>x==null?'·':x).join(', ')+')'):'—'; }
function famColor(f){
  return getComputedStyle(document.documentElement).getPropertyValue('--fam-'+f).trim()||'#7d8899';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 3. graph model + layout ------------------------------------ */
const G={ graph:null, nodes:[], byId:{}, edges:[], succ:{}, pred:{},
          sel:null, hover:null, hidden:new Set(), filter:'', approx:false };
const OPT={ labels:true, arrows:true, grid:true, ortho:false, gap:20, color:'family' };
const EDGE_COLOR={ sequential:'#5d6d85', residual:'#ff8a65', branch:'#c77dff',
                   recurrent:'#4cc9f0', skip:'#c77dff' };

function ingest(graph){
  G.graph=graph; G.nodes=graph.nodes; G.edges=graph.edges;
  G.byId={}; G.succ={}; G.pred={};
  for(const n of G.nodes) G.byId[n.id]=n;
  G.approx=G.nodes.some(n=>n.shape_assumed);
  for(const e of G.edges){
    if(!G.byId[e.src]||!G.byId[e.dst]) continue;
    (G.succ[e.src]=G.succ[e.src]||[]).push(e);
    (G.pred[e.dst]=G.pred[e.dst]||[]).push(e);
  }
  layout();
}

/* Layered DAG layout: X = longest-path column, Z = branch lane, Y = 0.
   Box proportions come from the tensor shape so the picture reads like a
   figure in a paper: thickness = channels, cross-section = spatial size. */
function layout(){
  const ns=G.nodes;
  let maxS=1, maxC=1;
  for(const n of ns){
    const g=n.geom||{};
    if(g.kind==='volume'){ maxS=Math.max(maxS,g.h||1,g.w||1); maxC=Math.max(maxC,g.c||1); }
    else if(g.kind==='seq'){ maxS=Math.max(maxS,g.l||1); maxC=Math.max(maxC,g.d||1); }
    else if(g.kind==='vector'){ maxS=Math.max(maxS,g.n||1); }
    else if(g.c) maxC=Math.max(maxC,g.c);
  }
  const spat=v=>10+52*Math.sqrt(clamp((v||1)/maxS,0,1));
  const thick=v=>5+30*Math.sqrt(clamp((v||1)/maxC,0,1));

  for(const n of ns){
    const g=n.geom||{kind:'abstract'};
    if(g.kind==='volume')      n.size=[thick(g.c),spat(g.h),spat(g.w)];
    else if(g.kind==='seq')    n.size=[Math.max(7,thick(g.d)*0.6),spat(g.l),spat(g.d)*0.7];
    else if(g.kind==='vector') n.size=[8,spat(g.n),12];
    else                       n.size=[thick(g.c||maxC*0.25),22,22];
    if(n.family==='activation'||n.family==='regular') n.size[0]=Math.min(n.size[0],9);
    if(n.family==='norm') n.size[0]=Math.min(n.size[0],11);
  }

  // columns: longest path from any source
  const col={}, indeg={};
  for(const n of ns) indeg[n.id]=(G.pred[n.id]||[]).filter(e=>e.kind!=='recurrent').length;
  for(const n of ns){
    const ps=(G.pred[n.id]||[]).filter(e=>e.kind!=='recurrent');
    col[n.id]=ps.length?Math.max(...ps.map(e=>(col[e.src]??0)+1)):0;
  }
  // lanes: successors after the first fan out in Z; merges come back to 0
  const lane={};
  const isMerge=n=>n && (n.family==='merge');
  for(const n of ns){
    if(lane[n.id]===undefined) lane[n.id]=0;
    const ss=(G.succ[n.id]||[]).filter(e=>e.kind!=='recurrent');
    let k=0;
    for(const e of ss){
      if(lane[e.dst]!==undefined) continue;
      if(isMerge(G.byId[e.dst])) lane[e.dst]=0;
      else { lane[e.dst]= k===0 ? lane[n.id] : lane[n.id]+k; k++; }
      if(k===0) k++;
    }
  }

  // x positions, one slot per column
  const cols={};
  for(const n of ns) (cols[col[n.id]]=cols[col[n.id]]||[]).push(n);
  const keys=Object.keys(cols).map(Number).sort((a,b)=>a-b);
  let cur=0; const colX={};
  for(const c of keys){
    const w=Math.max(...cols[c].map(n=>n.size[0]));
    colX[c]=cur+w/2; cur+=w+OPT.gap;
  }
  const laneGap=Math.max(70,maxS*0.22);
  let maxY=0;
  for(const n of ns){
    n.pos=[colX[col[n.id]], 0, (lane[n.id]||0)*laneGap];
    n.col=col[n.id]; n.lane=lane[n.id]||0;
    maxY=Math.max(maxY,n.size[1]);
  }
  G.extent={x0:0,x1:cur,maxY,laneGap};
  G.floorY=-maxY/2-26;
}

function visible(n){ return !G.hidden.has(n.family); }

function colorOf(n){
  if(OPT.color==='family') return famColor(n.family);
  const ramp=(t)=>{
    const stops=[[44,58,77],[58,110,165],[86,180,160],[245,166,35],[240,90,110]];
    t=clamp(t,0,1)*(stops.length-1); const i=Math.floor(t),f=t-i;
    const a=stops[i],b=stops[Math.min(i+1,stops.length-1)];
    return `#${[0,1,2].map(j=>Math.round(lerp(a[j],b[j],f)).toString(16).padStart(2,'0')).join('')}`;
  };
  if(OPT.color==='depth') return ramp(G.nodes.indexOf(n)/Math.max(1,G.nodes.length-1));
  const key=OPT.color==='params'?'n_params':'macs';
  const vals=G.nodes.map(x=>x[key]||0), mx=Math.max(...vals,1);
  return ramp(Math.log10(1+(n[key]||0))/Math.log10(1+mx));
}

/* curve sampling for non-straight connections */
function bez(p0,p1,p2,p3,steps=18){
  const out=[];
  for(let i=0;i<=steps;i++){
    const t=i/steps,u=1-t;
    out.push([0,1,2].map(j=>u*u*u*p0[j]+3*u*u*t*p1[j]+3*u*t*t*p2[j]+t*t*t*p3[j]));
  }
  return out;
}

function buildScene(){
  const s=new Scene();
  if(OPT.grid&&G.extent){
    const y=G.floorY, x0=-30, x1=G.extent.x1+10;
    const zs=Math.max(140,G.extent.laneGap*2.2);
    const step=Math.max(40,(x1-x0)/28);
    for(let x=x0;x<=x1;x+=step)
      s.line([[x,y,-zs],[x,y,zs]],'#1b2531',{lw:1,alpha:.55});
    for(let z=-zs;z<=zs;z+=step)
      s.line([[x0,y,z],[x1,y,z]],'#1b2531',{lw:1,alpha:.55});
  }

  if(OPT.arrows) for(const e of G.edges){
    const a=G.byId[e.src],b=G.byId[e.dst];
    if(!a||!b||!visible(a)||!visible(b)) continue;
    const p0=[a.pos[0]+a.size[0]/2,a.pos[1],a.pos[2]];
    const p3=[b.pos[0]-b.size[0]/2,b.pos[1],b.pos[2]];
    const rel=G.sel&&(e.src===G.sel||e.dst===G.sel);
    const hov=G.hover&&G.hover.edge===e;
    const col=EDGE_COLOR[e.kind]||'#5d6d85';
    const dim=G.sel&&!rel?0.16:(e.kind==='sequential'?0.75:0.95);
    let pts;
    if(e.kind==='residual'||e.kind==='branch'||e.kind==='skip'||a.lane!==b.lane){
      const span=Math.abs(p3[0]-p0[0]);
      const lift=e.kind==='residual'?Math.max(38,Math.min(span*0.42,a.size[1]/2+70)):0;
      const zoff=(b.pos[2]-a.pos[2])*0.55;
      pts=bez(p0,[p0[0]+span*0.3,p0[1]+lift,p0[2]+zoff*0.2],
                 [p3[0]-span*0.3,p3[1]+lift,p3[2]-zoff*0.2],p3);
    } else pts=[p0,p3];
    s.arrow(pts,col,{lw:hov?3.2:(rel?2.4:(e.kind==='sequential'?1.5:2)),
                     alpha:hov?1:dim,ref:{edge:e},
                     dash:e.kind==='recurrent'?[6,4]:null});
  }

  for(const n of G.nodes){
    if(!visible(n)) continue;
    const isSel=G.sel===n.id, isHov=G.hover&&G.hover.node===n.id;
    const dim=(G.sel&&!isSel&&!isNeighbour(n.id))||(G.filter&&!matches(n));
    s.box(n.pos,n.size,colorOf(n),{
      ref:{node:n.id}, dim, label:n.name,
      alpha:dim?0.45:1,
      stroke:isSel?'#ffffff':(isHov?'#cfe4ff':'rgba(0,0,0,.35)'),
      lw:isSel?2:(isHov?1.6:0.8)
    });
    if(isSel){
      s.line([[n.pos[0],G.floorY,n.pos[2]],[n.pos[0],n.pos[1]-n.size[1]/2,n.pos[2]]],
             '#ffffff',{lw:1,alpha:.3,dash:[3,4]});
    }
  }
  return s;
}
function isNeighbour(id){
  return (G.succ[id]||[]).some(e=>e.dst===G.sel)||(G.pred[id]||[]).some(e=>e.src===G.sel)
       ||(G.succ[G.sel]||[]).some(e=>e.dst===id)||(G.pred[G.sel]||[]).some(e=>e.src===id);
}
function matches(n){
  if(!G.filter) return true;
  const q=G.filter.toLowerCase();
  return n.name.toLowerCase().includes(q)||n.op.toLowerCase().includes(q);
}

/* ---------- 4. main viewport ------------------------------------------- */
const cv=document.getElementById('cv');
const R=new Renderer(cv);
let dirty=true;
const mark=()=>{dirty=true;};

function drawLabels(){
  if(!OPT.labels) return;
  const ctx=R.ctx, taken=[];
  const labs=R.labels.slice().sort((a,b)=>a.depth-b.depth);
  ctx.font='500 10.5px ui-sans-serif,system-ui,-apple-system,sans-serif';
  ctx.textBaseline='middle';
  for(const L of labs){
    const it=L.item; if(it.dim) continue;
    const sel=G.sel&&it.ref&&it.ref.node===G.sel;
    const top=Math.min(...L.ss.map(p=>p[1]));
    const wpx=Math.max(...L.ss.map(p=>p[0]))-Math.min(...L.ss.map(p=>p[0]));
    if(wpx<13&&!sel) continue;
    let txt=it.label;
    if(txt.length>26) txt='…'+txt.slice(-25);
    const w=ctx.measureText(txt).width;
    const x=L.x-w/2, y=top-11;
    if(y<8||y>R.H-4||x<-w||x>R.W) continue;
    const box=[x-3,y-7,w+6,14];
    if(!sel&&taken.some(t=>!(box[0]>t[0]+t[2]||box[0]+box[2]<t[0]||
                             box[1]>t[1]+t[3]||box[1]+box[3]<t[1]))) continue;
    taken.push(box);
    ctx.fillStyle=sel?'rgba(30,58,95,.95)':'rgba(13,17,23,.72)';
    ctx.fillRect(box[0],box[1],box[2],box[3]);
    ctx.textAlign='left'; ctx.fillStyle=sel?'#dfeeff':'#93a2b5';
    ctx.fillText(txt,x,y);
  }
}

function frame(){
  if(dirty){
    dirty=false;
    R.draw(buildScene());
    drawLabels();
    const c=R.cam;
    document.getElementById('axis').innerHTML=
      `flow →&nbsp;&nbsp;yaw ${(c.yaw*57.3).toFixed(0)}° pitch ${(c.pitch*57.3).toFixed(0)}°`;
  }
  requestAnimationFrame(frame);
}

function fit(anim=true){
  if(!G.nodes.length) return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9,z0=1e9,z1=-1e9;
  for(const n of G.nodes){ if(!visible(n))continue;
    x0=Math.min(x0,n.pos[0]-n.size[0]/2); x1=Math.max(x1,n.pos[0]+n.size[0]/2);
    y0=Math.min(y0,n.pos[1]-n.size[1]/2); y1=Math.max(y1,n.pos[1]+n.size[1]/2);
    z0=Math.min(z0,n.pos[2]-n.size[2]/2); z1=Math.max(z1,n.pos[2]+n.size[2]/2);
  }
  if(x0>x1) return;
  const t=[(x0+x1)/2,(y0+y1)/2,(z0+z1)/2];
  const span=Math.max(x1-x0,(y1-y0)*2.4,(z1-z0)*1.7);
  const d=clamp(span*0.92+150,150,9000);
  if(anim) tween(t,d); else { R.cam.target=t; R.cam.dist=d; mark(); }
}
let tw=null;
function tween(target,dist,yaw,pitch){
  const c=R.cam, from={t:c.target.slice(),d:c.dist,y:c.yaw,p:c.pitch}, t0=performance.now();
  tw={from,to:{t:target,d:dist,y:yaw===undefined?c.yaw:yaw,p:pitch===undefined?c.pitch:pitch},t0};
  const tick=()=>{
    if(!tw) return;
    const k=clamp((performance.now()-tw.t0)/380,0,1), e=1-Math.pow(1-k,3);
    c.target=V.lerp(tw.from.t,tw.to.t,e); c.dist=lerp(tw.from.d,tw.to.d,e);
    c.yaw=lerp(tw.from.y,tw.to.y,e); c.pitch=lerp(tw.from.p,tw.to.p,e);
    mark(); if(k<1) requestAnimationFrame(tick); else tw=null;
  };
  requestAnimationFrame(tick);
}

/* pointer interaction */
let drag=null, moved=0;
cv.addEventListener('pointerdown',ev=>{
  cv.setPointerCapture(ev.pointerId); moved=0;
  drag={x:ev.clientX,y:ev.clientY,pan:ev.shiftKey||ev.button===1||ev.button===2};
  cv.classList.add('drag');
});
cv.addEventListener('pointermove',ev=>{
  const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  if(drag){
    const dx=ev.clientX-drag.x, dy=ev.clientY-drag.y;
    moved+=Math.abs(dx)+Math.abs(dy);
    const c=R.cam;
    if(drag.pan){
      const k=c.dist*0.0016;
      c.target=V.add(c.target,V.add(V.mul(c.rgt,-dx*k),V.mul(c.up,dy*k)));
    } else {
      c.yaw+=dx*0.006; c.pitch=clamp(c.pitch+dy*0.005,-1.45,1.45);
    }
    drag.x=ev.clientX; drag.y=ev.clientY; mark(); hideTip(); return;
  }
  const hit=R.pick(mx,my);
  const changed=JSON.stringify(hit)!==JSON.stringify(G.hover);
  G.hover=hit;
  if(changed) mark();
  hit?showTip(hit,mx,my):hideTip();
});
const endDrag=ev=>{
  if(drag&&moved<5){
    const r=cv.getBoundingClientRect();
    const hit=R.pick(ev.clientX-r.left,ev.clientY-r.top);
    if(hit&&hit.node) select(hit.node);
    else if(hit&&hit.edge) showEdge(hit.edge);
    else { G.sel=null; renderDetail(null); mark(); }
  }
  drag=null; cv.classList.remove('drag');
};
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',()=>{drag=null;cv.classList.remove('drag');});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',ev=>{
  ev.preventDefault();
  R.cam.dist=clamp(R.cam.dist*Math.exp(ev.deltaY*0.0011),25,20000); mark();
},{passive:false});
cv.addEventListener('dblclick',ev=>{
  const r=cv.getBoundingClientRect();
  const hit=R.pick(ev.clientX-r.left,ev.clientY-r.top);
  if(hit&&hit.node) openExpand(hit.node);
});
cv.addEventListener('pointerleave',hideTip);

const tip=document.getElementById('tip');
function showTip(hit,mx,my){
  let html='';
  if(hit.node){
    const n=G.byId[hit.node];
    html=`<div class="t" style="color:${famColor(n.family)}">${esc(n.op)}</div>`+
         `<div class="s">${esc(n.name)}</div>`+
         `<div class="s" style="margin-top:4px">${shapeStr(n.in_shape)} → ${shapeStr(n.out_shape)}</div>`+
         (n.explain?`<div class="d">${esc(n.explain.what).slice(0,190)}${n.explain.what.length>190?'…':''}</div>`:'')+
         `<div class="d" style="color:var(--ink3);font-size:10.5px">click for detail · double-click to expand</div>`;
  } else if(hit.edge){
    const e=hit.edge;
    html=`<div class="t" style="color:${EDGE_COLOR[e.kind]}">${e.kind} connection</div>`+
         `<div class="s">${esc(e.src)} → ${esc(e.dst)}</div>`+
         (e.tensor_shape?`<div class="s" style="margin-top:3px">carries ${shapeStr(e.tensor_shape)}</div>`:'')+
         (e.note?`<div class="d">${esc(e.note)}</div>`:'');
  }
  tip.innerHTML=html; tip.classList.add('on');
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(mx+16,R.W-w-8)+'px';
  tip.style.top=Math.max(8,Math.min(my+16,R.H-h-8))+'px';
}
function hideTip(){ tip.classList.remove('on'); if(G.hover){G.hover=null;mark();} }

function select(id,focus){
  G.sel=id; renderDetail(G.byId[id]); mark();
  const el=document.querySelector(`.li[data-id="${CSS.escape(id)}"]`);
  document.querySelectorAll('.li.sel').forEach(e=>e.classList.remove('sel'));
  if(el){ el.classList.add('sel'); el.scrollIntoView({block:'nearest'}); }
  if(focus){
    const n=G.byId[id];

}
function showEdge(e){

}

/* ---------- 5. detail panel -------------------------------------------- */
function renderDetail(n){
  const el=document.getElementById('dt');
  if(!n){ el.innerHTML='<div class="empty">Click any layer to see what it does,<br>why it sits where it does,<br>and how its shape changes.</div>'; return; }
  const x=n.explain||{};
  const meta=G.graph.meta;
  const pShare=meta.total_params?100*n.n_params/meta.total_params:0;
  const mShare=meta.total_macs?100*(n.macs||0)/meta.total_macs:0;
  const asm=n.shape_assumed?' class="asm" title="computed from assumed stride/padding, not observed"':'';

  const sec=(t,body)=>body?`<div class="sec"><div class="st">${t}</div>${body}</div>`:'';
  const hyp=(x.hyper||[]).map(h=>
    `<div class="h"><b>${esc(h.name)} = <span>${esc(h.value)}</span></b>`+
    (h.note?`<div>${esc(h.note)}</div>`:'')+`</div>`).join('');
  const watch=(x.watch||[]).map(w=>`<li>${esc(w)}</li>`).join('');
  const conns=[]
    .concat((G.pred[n.id]||[]).map(e=>['in',e.src,e.kind]))
    .concat((G.succ[n.id]||[]).map(e=>['out',e.dst,e.kind]))
    .map(([d,id,k])=>`<div class="c" onclick="select('${esc(id)}',1)">`+
      `<span class="k">${d==='in'?'from':'to'}${k!=='sequential'?' ('+k+')':''}</span>`+
      `<span class="n">${esc(id)}</span></div>`).join('');

  el.innerHTML=
   `<div class="hd">
      <div class="op"><i style="background:${famColor(n.family)}"></i>${esc(n.op)}</div>
      <div class="pth">${esc(n.name)}</div>
    </div>
    <div class="shp"><code${asm}>${shapeStr(n.in_shape)}</code><span class="ar">→</span>
      <code${asm}>${shapeStr(n.out_shape)}</code>
      ${n.shape_assumed?'<span style="color:var(--warn);font-size:10px">~ computed</span>':''}</div>
    <div class="mets">
      <div class="met"><div class="k">Parameters</div><div class="v">${fmt(n.n_params)}</div>
        <div class="b"><i style="width:${clamp(pShare,0,100)}%"></i></div>
        <div class="k" style="margin-top:3px">${pShare.toFixed(1)}% of model</div></div>
      <div class="met"><div class="k">MACs / sample</div>
        <div class="v">${n.shape_assumed?'~':''}${fmt(n.macs)}</div>
        <div class="b"><i style="width:${clamp(mShare,0,100)}%;background:#f5a623"></i></div>
        <div class="k" style="margin-top:3px">${mShare.toFixed(1)}% of model</div></div>
    </div>
    ${n.rf&&(n.kind.startsWith('conv')||n.family==='pool')?
      `<div class="met" style="margin-bottom:2px"><div class="k">Receptive field here</div>
       <div class="v">${n.rf}×${n.rf} px</div>
       <div class="k" style="margin-top:3px">how much of the original input one unit of this layer can see</div></div>`:''}
    <button class="btn pri" id="d-expand">Expand layer — see it work in 3D</button>
    ${sec('What it does',x.what?`<p>${esc(x.what)}</p>`:'')}
    ${sec('Intuition',x.intuition?`<p>${esc(x.intuition)}</p>`:'')}
    ${sec('Why it sits here',x.why_here?`<p>${esc(x.why_here)}</p>`:'')}
    ${sec('Shape',x.shape?`<p>${esc(x.shape)}</p>`:'')}
    ${sec('Hyperparameters',hyp?`<div class="hyp">${hyp}</div>`:'')}
    ${sec('Watch out',watch?`<ul class="warns">${watch}</ul>`:'')}
    ${sec('Connections',conns?`<div class="conn">${conns}</div>`:'')}`;
  const b=document.getElementById('d-expand');
  if(b) b.onclick=()=>openExpand(n.id);
}

/* ---------- 6. expanded layer: how this layer actually works ------------ */
/* Each scene is a tiny animated 3D explainer. Coordinates: X = width,
   Y = height (up), Z = channels/depth. Grids are capped in size and the
   caption says so, because 56x56x256 drawn literally is just noise. */

const mcv=document.getElementById('mc'), MR=new Renderer(mcv);
const M={ node:null, scene:null, playing:true, speed:1, step:0, frac:0, last:0, raf:null };
const CAP=8;                          // max cells drawn per grid axis
const CAPC=6;                         // max channel slabs drawn

function rnd(seed){ let s=seed>>>0; return ()=>((s=(s*1664525+1013904223)>>>0)/4294967296); }
function heat(v){                     // -1..1 -> blue .. grey .. red
  const t=clamp((v+1)/2,0,1);
  const a=[86,140,240],b=[176,186,201],c=[248,116,104];
  const p=t<0.5?[a,b,t*2]:[b,c,(t-0.5)*2];
  return `rgb(${[0,1,2].map(i=>Math.round(lerp(p[0][i],p[1][i],p[2]))).join(',')})`;
}
const K={
  /* a plane of cells in XY at depth z */
  plane(s,ox,oy,z,nx,ny,cell,fn,th=2.2,opts={}){
    for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){
      const o=fn?fn(i,j):{};
      if(o===null) continue;
      s.box([ox+(i+0.5)*cell, oy-(j+0.5)*cell, z],[cell*0.92,cell*0.92,th],
            o.color||'#3d4a5c',{alpha:o.alpha===undefined?(opts.alpha||1):o.alpha,
            stroke:o.stroke||'rgba(0,0,0,.35)',lw:o.lw||0.6,ref:o.ref});
    }
  },
  /* a stack of planes along Z: one per channel */
  stack(s,ox,oy,z0,nx,ny,nc,cell,gap,fn,opts={}){
    for(let c=nc-1;c>=0;c--)
      K.plane(s,ox,oy,z0+c*gap,nx,ny,cell,(i,j)=>fn(i,j,c),2.2,opts);
  },
  label(s,p,str,color='#9aa8b8',size=12,align='center'){
    s.text(p,str,{color,font:`${size}px ui-sans-serif,system-ui`,align});
  },
  brace(s,p0,p1,color='#4a5a70'){ s.line([p0,p1],color,{lw:1,alpha:.8,dash:[4,3]}); }
};
function dims(node){                  // (Cin,Hin,Win) and (Cout,Hout,Wout)
  const cl=G.graph.meta.channels_last;
  const pick=s=>{
    if(!s) return null;
    const b=s.slice(1);
    if(b.length===3) return cl?[b[2],b[0],b[1]]:[b[0],b[1],b[2]];
    if(b.length===2) return [b[1],b[0],1];
    if(b.length===1) return [b[0],1,1];
    return null;
  };
  return {i:pick(node.in_shape),o:pick(node.out_shape)};
}
const p1=v=>Array.isArray(v)?v[0]:v;

/* ---- individual scenes ------------------------------------------------ */
const SCENES={};

SCENES.conv=(n)=>{
  const P=n.params, k=p1(P.kernel_size)||3, st=p1(P.stride)||1;
  const d=dims(n);
  const Cin=(d.i&&d.i[0])||P.in_channels||3, Cout=(d.o&&d.o[0])||P.out_channels||8;
  const trans=n.kind.startsWith('convtranspose');
  const kc=Math.min(k,9);                       // kernel as drawn
  const gw=clamp(kc+4,7,13);                    // input grid as drawn
  const ow=Math.max(1,Math.floor((gw-kc)/st)+1);// output grid that implies
  const cell=Math.round(150/gw), kcell=Math.round(cell*0.86);
  const gap=Math.max(8,cell*0.6);
  const nci=Math.min(CAPC,Cin), nco=Math.min(CAPC,Cout);
  const steps=Math.max(1,ow*ow);
  const IX=-235, KX=-40, OX=120, TOP=95;
  return {
    steps, view:{yaw:Math.PI/2-0.30,pitch:0.24,dist:430},
    build(s,p){
      const ci=p%ow, cj=Math.floor(p/ow)%ow, ki=ci*st, kj=cj*st;
      const R1=rnd(7), vals=[];
      for(let c=0;c<nci;c++){vals[c]=[];for(let j=0;j<gw;j++){vals[c][j]=[];
        for(let i=0;i<gw;i++) vals[c][j][i]=R1()*2-1;}}

      K.stack(s,IX,TOP,-nci*gap/2,gw,gw,nci,cell,gap,(i,j,c)=>{
        const inK=i>=ki&&i<ki+kc&&j>=kj&&j<kj+kc;
        return {color:inK?'#ffb02e':heat(vals[c][j][i]*0.8),
                alpha:inK?1:0.88,stroke:inK?'#fff3cf':'rgba(0,0,0,.4)',lw:inK?1.1:0.5};
      });
      K.label(s,[IX+gw*cell/2,TOP+24,0],`input · ${Cin} × ${(d.i&&d.i[1])||'?'} × ${(d.i&&d.i[2])||'?'}`,'#c9d4e2',13);
      K.label(s,[IX+gw*cell/2,TOP-gw*cell-20,0],
        `showing a ${gw}×${gw} corner, ${nci} of ${Cin} channels`,'#63718a',10.5);

      // the kernel, floating between the two volumes and visibly smaller
      const KY=TOP-6;
      K.stack(s,KX,KY,-nci*gap/2,kc,kc,nci,kcell,gap,()=>({color:'#ffb02e',alpha:.95,
        stroke:'#ffe6b0',lw:1}));
      K.label(s,[KX+kc*kcell/2,KY+24,0],`kernel · ${k}×${k}×${Cin}`,'#ffcf7a',13);
      K.label(s,[KX+kc*kcell/2,KY-kc*kcell-20,0],
        `${k*k*Cin} weights — the same ones at every position`,'#a08a5c',10.5);

      K.stack(s,OX,TOP,-nco*gap/2,ow,ow,nco,cell,gap,(i,j,c)=>{
        const idx=j*ow+i, done=idx<p, now=idx===p;
        return {color:now?'#ffd479':(done?heat((rnd(i*31+j*7+c*13)()*2-1)*0.9):'#37455a'),
                alpha:now?1:(done?0.95:0.6),stroke:now?'#fff3cf':'rgba(0,0,0,.35)',lw:now?1.3:0.5};
      });
      K.label(s,[OX+ow*cell/2,TOP+24,0],`output · ${Cout} × ${(d.o&&d.o[1])||'?'} × ${(d.o&&d.o[2])||'?'}`,'#c9d4e2',13);
      K.label(s,[OX+ow*cell/2,TOP-ow*cell-20,0],
        `the ${ow}×${ow} this corner produces`,'#63718a',10.5);

      const src=[IX+(ki+kc/2)*cell,TOP-(kj+kc/2)*cell,0];
      const kk =[KX+kc*kcell/2,KY-kc*kcell/2,0];
      const dst=[OX+(ci+0.5)*cell,TOP-(cj+0.5)*cell,0];
      s.arrow([src,kk],'#ffb02e',{lw:1.5,alpha:.85});
      s.arrow([kk,dst],'#ffd479',{lw:1.8,alpha:.95});
      K.label(s,[(kk[0]+dst[0])/2,(kk[1]+dst[1])/2+16,0],'multiply, then sum','#ffcf7a',11.5);

      return `<span class="step">Position ${p+1} of ${steps} in this corner</span> — the kernel
        covers rows ${kj}–${kj+kc-1}, columns ${ki}–${ki+kc-1}. It multiplies its
        <b>${k}×${k}×${Cin} = ${(k*k*Cin).toLocaleString()}</b> weights element-by-element with the
        patch underneath, adds all those products into <b>one number</b>, and writes it to output
        cell (${cj}, ${ci}). Then it slides ${st} ${st>1?'cells':'cell'} and does it again.
        <br>The same weights are reused at every position — that is weight sharing, and it is why a
        convolution can find one pattern anywhere in the image using only
        ${(k*k*Cin).toLocaleString()} numbers instead of one weight per pixel. A whole sweep like
        this produces <b>one</b> output channel; repeat with a different kernel for each of the
        <b>${Cout}</b> channels.${trans?' <br>This is a <b>transposed</b> convolution, so it runs the other way: each input cell stamps a scaled copy of the kernel onto a larger output and the overlaps add up.':''}
        ${st>1?`<br>With stride ${st} the output is ${st}× smaller per axis — ${(d.i&&d.i[1])||'?'}→${(d.o&&d.o[1])||'?'} here.`:''}`;
    }
  };
};
SCENES.linear=(n)=>{
  const P=n.params;
  const fin=P.in_features||(n.in_shape&&n.in_shape[n.in_shape.length-1])||8;
  const fout=P.out_features||(n.out_shape&&n.out_shape[n.out_shape.length-1])||6;
  const NI=Math.min(10,fin), NO=Math.min(8,fout), cell=26;
  return {
    steps:NO, view:{yaw:1.60,pitch:0.16,dist:560},
    build(s,p){
      const R1=rnd(3), iv=[]; for(let i=0;i<NI;i++) iv.push(R1()*2-1);
      K.plane(s,-330,NI*cell/2,0,1,NI,cell,(i,j)=>({color:heat(iv[j]),stroke:'#0b0f15',lw:0.8}));
      K.label(s,[-330+cell/2,NI*cell/2+24,0],`input · ${fin}`,'#c9d4e2',13);
      // weight matrix: rows = outputs, cols = inputs
      K.plane(s,-190,NO*cell/2,0,NI,NO,cell,(i,j)=>{
        const on=j===p;
        return {color:on?'#ffb02e':heat((rnd(i*17+j*29)()*2-1)*0.75),
                alpha:on?1:0.66,stroke:on?'#ffe6b0':'rgba(0,0,0,.3)',lw:on?1.2:0.5};
      });
      K.label(s,[-190+NI*cell/2,NO*cell/2+24,0],`weights · ${fout}×${fin}`,'#c9d4e2',13);
      K.label(s,[-190+NI*cell/2,NO*cell/2-NO*cell-26,0],
        `${(fin*fout).toLocaleString()} numbers`,'#63718a',11);
      const ox=120;
      K.plane(s,ox,NO*cell/2,0,1,NO,cell,(i,j)=>{
        const on=j===p, done=j<p;
        return {color:on?'#ffd479':(done?heat(rnd(j*13)()*2-1):'#37455a'),
                alpha:on||done?1:0.55,stroke:on?'#fff3cf':'rgba(0,0,0,.3)',lw:on?1.3:0.6};
      });
      K.label(s,[ox+cell/2,NO*cell/2+24,0],`output · ${fout}`,'#c9d4e2',13);
      // fan-in lines for the active output
      const y=NO*cell/2-(p+0.5)*cell;
      for(let i=0;i<NI;i++){
        const a=[-330+cell/2,NI*cell/2-(i+0.5)*cell,0];
        s.line([a,[-190+(i+0.5)*cell,y,0]],'#ffb02e',{lw:0.9,alpha:.45});
      }
      s.arrow([[-190+NI*cell,y,0],[ox,y,0]],'#ffb02e',{lw:2,alpha:.95});
      return `<span class="step">Output ${p+1} of ${fout}</span> — one highlighted row of the weight
        matrix is multiplied element-wise with the whole input vector and summed:
        <b>out[${p}] = Σ<sub>i</sub> W[${p}][i] · in[i]${P.bias!==false?' + b['+p+']':''}</b>.
        <br>Every output touches every input — that is what "fully connected" means, and it is why
        the matrix holds <b>${fin}×${fout} = ${(fin*fout).toLocaleString()}</b> weights. Unlike a
        convolution there is no weight sharing and no notion of neighbouring positions: shuffle the
        inputs consistently and this layer cannot tell.`;
    }
  };
};

SCENES.pool=(n)=>{
  const P=n.params, k=p1(P.kernel_size||P.pool)||2, st=p1(P.stride)||k;
  const isMax=n.kind==='maxpool';
  const gw=Math.min(CAP,8), ow=Math.max(1,Math.floor((gw-k)/st)+1), cell=30;
  return {
    steps:ow*ow, view:{yaw:1.50,pitch:0.22,dist:560},
    build(s,p){
      const ci=p%ow, cj=Math.floor(p/ow)%ow, ki=ci*st, kj=cj*st;
      const R1=rnd(11), v=[];
      for(let j=0;j<gw;j++){v[j]=[];for(let i=0;i<gw;i++)v[j][i]=R1();}
      let best=-1,bi=0,bj=0,sum=0,cnt=0;
      for(let j=kj;j<kj+k;j++)for(let i=ki;i<ki+k;i++){
        if(v[j][i]>best){best=v[j][i];bi=i;bj=j;} sum+=v[j][i]; cnt++;}
      const res=isMax?best:sum/cnt;
      K.plane(s,-260,110,0,gw,gw,cell,(i,j)=>{
        const inW=i>=ki&&i<ki+k&&j>=kj&&j<kj+k;
        const win=isMax&&inW&&i===bi&&j===bj;
        return {color:win?'#4ade80':(inW?'#ffb02e':heat(v[j][i]*1.6-0.8)),
                alpha:inW?1:0.86,stroke:win?'#bbf7d0':(inW?'#ffe6b0':'rgba(0,0,0,.3)'),
                lw:win?1.5:(inW?1:0.5)};
      });
      K.label(s,[-260+gw*cell/2,110+26,0],`input map  ${n.in_shape?n.in_shape.slice(-2).join('×'):''}`,'#c9d4e2',13);
      const ox=110;
      K.plane(s,ox,110,0,ow,ow,cell,(i,j)=>{
        const now=(j*ow+i)===p, done=(j*ow+i)<p;
        return {color:now?'#4ade80':(done?heat(rnd(i*7+j*13)()*1.4-0.7):'#37455a'),
                alpha:now||done?1:0.55,stroke:now?'#bbf7d0':'rgba(0,0,0,.3)',lw:now?1.5:0.6};
      });
      K.label(s,[ox+ow*cell/2,110+26,0],`output map  ${n.out_shape?n.out_shape.slice(-2).join('×'):''}`,'#c9d4e2',13);
      s.arrow([[-260+(ki+k/2)*cell,110-(kj+k/2)*cell,0],[ox+(ci+0.5)*cell,110-(cj+0.5)*cell,0]],
              isMax?'#4ade80':'#ffb02e',{lw:1.8,alpha:.85});
      return `<span class="step">Window ${p+1} of ${ow*ow}</span> — a ${k}×${k} window covers
        ${k*k} values and emits <b>${isMax?'the largest':'their average'}</b>
        (${res.toFixed(2)}), then jumps ${st} cell${st>1?'s':''}.
        <br>${isMax?
          'Because only the maximum survives, a feature detected one cell to the left produces the same output — that is where a CNN\'s small tolerance to translation comes from. Note also that '+(k*k-1)+' of every '+(k*k)+' values are discarded entirely, and no gradient flows back through them.':
          'Averaging keeps a smooth summary of the neighbourhood rather than only its peak, so nothing is discarded outright but sharp responses get diluted.'}
        There are <b>no parameters here at all</b> — the rule is fixed, not learned.`;
    }
  };
};

SCENES.globalpool=(n)=>{
  const d=dims(n), C=(d.i&&d.i[0])||16, H=Math.min(CAP,(d.i&&d.i[1])||6);
  const nc=Math.min(CAPC,C), cell=24, gap=26;
  return {
    steps:nc, view:{yaw:1.20,pitch:0.34,dist:600},
    build(s,p){
      for(let c=0;c<nc;c++){
        const gone=c<p;
        K.plane(s,-180,110,-nc*gap/2+c*gap,H,H,cell,(i,j)=>
          gone?null:{color:heat(rnd(c*97+i*7+j*3)()*1.6-0.8),alpha:0.75});
        const mean=rnd(c*97)()*1.6-0.8;
        if(gone||c===p)
          s.box([190,110-(c+0.5)*cell*1.2,-nc*gap/2+c*gap],[cell,cell,cell],heat(mean),
                {stroke:c===p?'#fff':'rgba(0,0,0,.3)',lw:c===p?1.6:0.6});
        if(c===p) s.arrow([[-180+H*cell/2,110-H*cell/2,-nc*gap/2+c*gap],
                           [190,110-(c+0.5)*cell*1.2,-nc*gap/2+c*gap]],'#2fc9a5',{lw:2});
      }
      K.label(s,[-180+H*cell/2,150,0],`${C} feature maps of ${(d.i&&d.i[1])}×${(d.i&&d.i[2])}`,'#c9d4e2',13);
      K.label(s,[190,150,0],`${C} numbers`,'#c9d4e2',13);
      return `<span class="step">Channel ${p+1} of ${C}</span> — each whole feature map collapses to
        a single number: its average over all ${((d.i&&d.i[1])||0)*((d.i&&d.i[2])||0)} positions.
        <br>This throws away <b>where</b> a feature was found and keeps only <b>how much</b> of it
        there was. That is exactly the right prior for a whole-image label, it makes the network
        accept any input resolution, and it shrinks the classifier's input from
        ${(((d.i&&d.i[1])||1)*((d.i&&d.i[2])||1)*C).toLocaleString()} values to ${C} — which is why
        modern CNNs replaced the big flatten-then-dense head with this.`;
    }
  };
};

SCENES.activation=(n)=>{
  const fns={relu:x=>Math.max(0,x), relu6:x=>Math.min(Math.max(0,x),6),
    gelu:x=>x*0.5*(1+Math.tanh(0.7978845608*(x+0.044715*x*x*x))),
    silu:x=>x/(1+Math.exp(-x)), sigmoid:x=>1/(1+Math.exp(-x)), tanh:x=>Math.tanh(x),
    leakyrelu:x=>x>0?x:0.01*x, elu:x=>x>0?x:Math.exp(x)-1, softmax:x=>x,
    hardswish:x=>x*clamp(x+3,0,6)/6, mish:x=>x*Math.tanh(Math.log(1+Math.exp(x))),
    selu:x=>1.0507*(x>0?x:1.6733*(Math.exp(x)-1)), prelu:x=>x>0?x:0.25*x};
  const f=fns[n.kind]||(x=>Math.max(0,x));
  const N=7, cell=30;
  return {
    steps:N*N, view:{yaw:1.571,pitch:0.05,dist:520},
    build(s,p){
      const R1=rnd(5), v=[];
      for(let j=0;j<N;j++){v[j]=[];for(let i=0;i<N;i++)v[j][i]=(R1()*2-1)*2.4;}
      K.plane(s,-300,110,0,N,N,cell,(i,j)=>({color:heat(v[j][i]/2.4),
        alpha:(j*N+i)<=p?1:0.62,stroke:(j*N+i)===p?'#fff':'rgba(0,0,0,.3)',lw:(j*N+i)===p?1.6:0.5}));
      K.label(s,[-300+N*cell/2,110+26,0],'before','#c9d4e2',13);
      K.plane(s,120,110,0,N,N,cell,(i,j)=>({color:heat(clamp(f(v[j][i])/2.4,-1,1)),
        alpha:(j*N+i)<=p?1:0.18,stroke:(j*N+i)===p?'#fff':'rgba(0,0,0,.3)',lw:(j*N+i)===p?1.6:0.5}));
      K.label(s,[120+N*cell/2,110+26,0],'after','#c9d4e2',13);
      // function curve, drawn in the gap
      const pts=[];
      for(let i=0;i<=48;i++){const x=-3+6*i/48; pts.push([-90+x*22,10+clamp(f(x),-3,3)*22,0]);}
      s.line([[-90-3*22,10,0],[-90+3*22,10,0]],'#3a4759',{lw:1});
      s.line([[-90,10-3*22,0],[-90,10+3*22,0]],'#3a4759',{lw:1});
      s.line(pts,'#58a6ff',{lw:2.4});
      const cx=v[Math.floor(p/N)][p%N];
      s.box([-90+clamp(cx,-3,3)*22,10+clamp(f(cx),-3,3)*22,0],[9,9,9],'#ffd479',{stroke:'#fff',lw:1});
      K.label(s,[-90,10-3*22-20,0],`y = ${n.op}(x)`,'#8fb8e8',12);
      const iv=v[Math.floor(p/N)][p%N];
      return `<span class="step">Element ${p+1} of ${N*N}</span> — the function is applied to each
        number completely independently: <b>${iv.toFixed(2)} → ${f(iv).toFixed(2)}</b>. No mixing,
        no parameters, no change of shape.
        <br>${n.explain&&n.explain.intuition?esc(n.explain.intuition):''}
        <br>Look at the flat region of the curve: any input landing there has gradient
        <b>${n.kind==='relu'?'exactly zero':'close to zero'}</b>, so those units stop learning while
        they stay on that side. That single fact drives most activation-function design.`;
    }
  };
};

SCENES.norm=(n)=>{
  const N=12, cell=26;
  const perChannel=n.kind==='batchnorm';
  return {
    steps:4, view:{yaw:1.571,pitch:0.06,dist:520},
    build(s,p){
      const R1=rnd(9), raw=[];
      for(let i=0;i<N;i++) raw.push(1.8+R1()*3.4);          // shifted, wide
      const mean=raw.reduce((a,b)=>a+b)/N;
      const sd=Math.sqrt(raw.reduce((a,b)=>a+(b-mean)**2,0)/N);
      const stage=p;
      const val=i=>{
        if(stage===0) return raw[i];
        if(stage===1) return raw[i]-mean;
        if(stage===2) return (raw[i]-mean)/sd;
        return (raw[i]-mean)/sd*1.2+0.3;                     // gamma, beta
      };
      s.line([[-N*cell/2-20,0,0],[N*cell/2+20,0,0]],'#3a4759',{lw:1.2});
      for(let i=0;i<N;i++){
        const v=val(i), h=Math.abs(v)*26;
        s.box([-N*cell/2+(i+0.5)*cell, v*13, 0],[cell*0.8,Math.max(3,h),cell*0.8],
              heat(clamp(v/2.5,-1,1)),{stroke:'rgba(0,0,0,.35)',lw:0.6});
      }
      const names=['raw pre-activations','− mean  (re-centred)','÷ std  (re-scaled)','× γ  + β  (learned)'];
      K.label(s,[0,150,0],names[stage],'#c9d4e2',15);
      K.label(s,[0,-120,0],perChannel?
        'statistics taken over the batch and every spatial position, one set per channel':
        'statistics taken across the features of this one sample','#63718a',12);
      const txt=[
        `The layer receives whatever distribution the previous layer happens to produce — here
         mean ${mean.toFixed(2)}, spread ${sd.toFixed(2)}. As training changes the weights below,
         this distribution keeps drifting.`,
        `Step 1: subtract the mean, so the values are centred on zero.`,
        `Step 2: divide by the standard deviation. Now the distribution has a fixed shape no matter
         what the layers below did — which is the whole point, because the nonlinearity that follows
         has a fixed useful range.`,
        `Step 3: multiply by learned γ and add learned β. Without this the layer would be a
         straitjacket; with it, the network can restore any scale it actually wants — including
         undoing the normalization entirely. Normalization constrains the <i>optimizer</i>, not the
         model's expressive power.`][stage];
      return `<span class="step">Stage ${p+1} of 4</span> — ${txt}`;
    }
  };
};

SCENES.attention=(n)=>{
  const P=n.params, L=6, dm=P.embed_dim||P.num_heads*(P.head_dim||16)||64;
  const heads=P.num_heads||4, cell=26;
  return {
    steps:L*3, view:{yaw:1.571,pitch:0.10,dist:640},
    build(s,p){
      const q=Math.floor(p/3), ph=p%3, D=5;
      const R1=rnd(21), att=[];
      for(let i=0;i<L;i++){ let row=[],sum=0;
        for(let j=0;j<L;j++){ const e=Math.exp((rnd(i*37+j*11)()*2-1)*1.8); row.push(e); sum+=e; }
        att.push(row.map(x=>x/sum)); }
      // Q / K / V
      const put=(ox,name,col,hl)=>{
        K.plane(s,ox,L*cell/2,0,D,L,cell,(i,j)=>({
          color:hl(i,j)?col:heat((rnd(i*5+j*3+ox)()*2-1)*0.6),
          alpha:hl(i,j)?1:0.7,stroke:hl(i,j)?'#fff':'rgba(0,0,0,.3)',lw:hl(i,j)?1.2:0.5}));
        K.label(s,[ox+D*cell/2,L*cell/2+22,0],name,'#c9d4e2',12);
      };
      put(-380,'Q  (queries)','#58a6ff',(i,j)=>j===q&&ph>=0);
      put(-380+D*cell+26,'K  (keys)','#f5a623',(i,j)=>ph>=1);
      put(-380+2*(D*cell+26),'V  (values)','#7ed957',(i,j)=>ph>=2);
      // attention matrix
      const ax=110;
      K.plane(s,ax,L*cell/2,0,L,L,cell,(i,j)=>{
        const on=j===q&&ph>=1;
        return {color:on?'#58a6ff':'#3a4759',
                alpha:on?clamp(0.3+att[q][i]*2.4,0,1):0.5,
                stroke:on?'#8fc0ff':'rgba(0,0,0,.3)',lw:on?1:0.5};
      });
      K.label(s,[ax+L*cell/2,L*cell/2+22,0],`attention  ${L}×${L}`,'#c9d4e2',12);
      if(ph>=1) for(let i=0;i<L;i++)
        K.label(s,[ax+(i+0.5)*cell,L*cell/2-(q+0.5)*cell,14],att[q][i].toFixed(2),'#dce9ff',9);
      // output
      const ox=ax+L*cell+50;
      K.plane(s,ox,L*cell/2,0,D,L,cell,(i,j)=>({
        color:j===q&&ph>=2?'#7ed957':'#3a4759',
        alpha:j<q||(j===q&&ph>=2)?0.95:0.45,stroke:'rgba(0,0,0,.3)',lw:0.5}));
      K.label(s,[ox+D*cell/2,L*cell/2+22,0],'output','#c9d4e2',12);
      const qy=L*cell/2-(q+0.5)*cell;
      if(ph>=1) s.arrow([[-380+D*cell,qy,0],[ax,qy,0]],'#58a6ff',{lw:1.8,alpha:.9});
      if(ph>=2) s.arrow([[ax+L*cell,qy,0],[ox,qy,0]],'#7ed957',{lw:1.8,alpha:.9});
      const txt=[
        `<b>Token ${q+1}</b> emits a query vector — "this is what I am looking for". Every token also
         emits a key ("this is what I offer") and a value ("this is what I would contribute").`,
        `The query is dotted with <b>all ${L} keys</b>, giving ${L} raw scores. Softmax turns them
         into weights that sum to 1 — so the tokens compete: attending more to one necessarily means
         attending less to the others. The row lit up here is token ${q+1}'s attention distribution.`,
        `The output for token ${q+1} is the <b>weighted average of the value vectors</b>, using those
         weights. Token ${q+1} has now absorbed information from wherever in the sequence it found
         relevant, in a single step and regardless of distance.`][ph];
      return `<span class="step">Token ${q+1} of ${L}, stage ${ph+1} of 3</span> — ${txt}
        <br>All of this happens <b>${heads} times in parallel</b> in separate ${Math.round(dm/heads)}-dimensional
        subspaces (the heads), and the results are concatenated — so one head can track syntax while
        another tracks reference. Note the attention matrix is ${L}×${L}: cost grows with the
        <b>square</b> of sequence length, which is what bounds context windows.`;
    }
  };
};

SCENES.embedding=(n)=>{
  const P=n.params, V0=P.num_embeddings||1000, D=Math.min(8,P.embedding_dim||16);
  const rows=8, cell=26;
  return {
    steps:rows, view:{yaw:1.571,pitch:0.08,dist:520},
    build(s,p){
      K.plane(s,-200,rows*cell/2,0,D,rows,cell,(i,j)=>({
        color:j===p?heat((rnd(i*3+j*7)()*2-1)):'#3a4759',
        alpha:j===p?1:0.6,stroke:j===p?'#fff':'rgba(0,0,0,.3)',lw:j===p?1.3:0.5}));
      K.label(s,[-200+D*cell/2,rows*cell/2+24,0],`lookup table  ${V0.toLocaleString()} × ${P.embedding_dim}`,'#c9d4e2',13);
      for(let j=0;j<rows;j++)
        K.label(s,[-218,rows*cell/2-(j+0.5)*cell,0],`id ${j}`,j===p?'#ffd479':'#4d5a6d',11,'right');
      const oy=rows*cell/2-(p+0.5)*cell;
      s.box([-330,oy,0],[38,26,26],'#ffb02e',{stroke:'#ffe6b0',lw:1});
      K.label(s,[-330,oy,16],`${p}`,'#1a1206',13);
      s.arrow([[-305,oy,0],[-205,oy,0]],'#ffb02e',{lw:2});
      K.plane(s,120,oy+cell/2,0,D,1,cell,(i)=>({color:heat(rnd(i*3+p*7)()*2-1),stroke:'#fff',lw:1}));
      s.arrow([[-200+D*cell,oy,0],[115,oy,0]],'#7ed957',{lw:2});
      K.label(s,[120+D*cell/2,oy+26,0],`vector · ${P.embedding_dim} numbers`,'#c9d4e2',12);
      return `<span class="step">Token id ${p}</span> — the input integer is used as a
        <b>row index</b>. There is no arithmetic at all: row ${p} is copied out, and that
        ${P.embedding_dim}-number vector is the token's representation.
        <br>Training moves these rows around until symbols that behave similarly sit near each other.
        The table holds <b>${(V0*(P.embedding_dim||0)).toLocaleString()}</b> numbers, which in
        language models is often the single largest layer — and the reason the output projection
        frequently reuses this very matrix instead of learning a second one.`;
    }
  };
};

SCENES.flatten=(n)=>{
  const d=dims(n), C=Math.min(4,(d.i&&d.i[0])||3), H=Math.min(4,(d.i&&d.i[1])||4);
  const cell=26, gap=34, total=C*H*H;
  return {
    steps:Math.min(total,24), view:{yaw:1.28,pitch:0.30,dist:620},
    build(s,p){
      const n0=Math.min(total,24);
      for(let c=0;c<C;c++) K.plane(s,-300,110,-C*gap/2+c*gap,H,H,cell,(i,j)=>{
        const idx=c*H*H+j*H+i;
        return idx<p?null:{color:heat(rnd(idx*13)()*2-1),alpha:0.8};
      });
      K.label(s,[-300+H*cell/2,150,0],`${(d.i||[]).join(' × ')}`,'#c9d4e2',13);
      const lw=14;
      for(let k=0;k<n0;k++){
        s.box([-140+k*lw,-120,0],[lw*0.85,lw*0.85,lw*0.85],
              k<p?heat(rnd(k*13)()*2-1):'#37455a',{alpha:k<p?1:0.5,
              stroke:k===p-1?'#fff':'rgba(0,0,0,.3)',lw:k===p-1?1.4:0.5});
      }
      K.label(s,[-140+n0*lw/2,-150,0],
        `one vector of ${(n.out_shape?n.out_shape[n.out_shape.length-1]:total).toLocaleString()}`,'#c9d4e2',13);
      if(p>0){
        const c=Math.floor((p-1)/(H*H)), r=Math.floor(((p-1)%(H*H))/H), q=(p-1)%H;
        s.arrow([[-300+(q+0.5)*cell,110-(r+0.5)*cell,-C*gap/2+c*gap],
                 [-140+(p-1)*lw,-105,0]],'#58a6ff',{lw:1.4,alpha:.7});
      }
      return `<span class="step">Element ${p} of ${total>24?'the first 24':total}</span> — the cells
        are read out in memory order (channel, then row, then column) and laid end to end. Nothing is
        computed and no parameter is involved; only the indexing changes.
        <br>What <i>is</i> lost is adjacency: after this point nothing records that two numbers used
        to be neighbours. And because the following dense layer needs exactly
        <b>${(n.out_shape?n.out_shape[n.out_shape.length-1]:total).toLocaleString()}</b> inputs, the
        model is now locked to this one input resolution — the reason global average pooling replaced
        flatten in most modern CNNs.`;
    }
  };
};

SCENES.dropout=(n)=>{
  const pr=n.params.p!==undefined?n.params.p:(n.params.rate!==undefined?n.params.rate:0.5);
  const N=8, cell=28;
  return {
    steps:6, view:{yaw:1.571,pitch:0.05,dist:500},
    build(s,p){
      const R1=rnd(100+p*7), keep=[];
      for(let j=0;j<N;j++){keep[j]=[];for(let i=0;i<N;i++)keep[j][i]=R1()>pr;}
      K.plane(s,-280,110,0,N,N,cell,(i,j)=>({color:heat(rnd(i*3+j*11)()*2-1),alpha:0.85}));
      K.label(s,[-280+N*cell/2,110+26,0],'activations','#c9d4e2',13);
      K.plane(s,60,110,0,N,N,cell,(i,j)=>({
        color:keep[j][i]?heat(rnd(i*3+j*11)()*2-1):'#161d28',
        alpha:keep[j][i]?1:0.5,stroke:keep[j][i]?'rgba(0,0,0,.3)':'#3b2a2a',lw:0.6}));
      K.label(s,[60+N*cell/2,110+26,0],`after dropout (p = ${pr})`,'#c9d4e2',13);
      const dropped=keep.flat().filter(x=>!x).length;
      K.label(s,[60+N*cell/2,110-N*cell-26,0],
        `${dropped} of ${N*N} zeroed · survivors scaled ×${(1/(1-pr)).toFixed(2)}`,'#63718a',12);
      s.arrow([[-280+N*cell+10,110-N*cell/2,0],[55,110-N*cell/2,0]],'#7d8899',{lw:2});
      return `<span class="step">Training step ${p+1}</span> — a <b>different random ${Math.round(pr*100)}%</b>
        of the activations is zeroed every single step, and the survivors are scaled by
        1/(1−${pr}) = ${(1/(1-pr)).toFixed(2)} so the total signal keeps the same expected size.
        <br>Because no unit can count on any particular partner being present, the network is pushed
        to spread each concept across many units instead of relying on one fragile detector. It is
        ensemble averaging over exponentially many thinned networks, for free.
        <br><b>At evaluation time this layer does nothing at all</b> — it becomes the identity. That
        train/eval split is the source of the classic "great while training, broken at inference" bug
        when <code>.eval()</code> is never called.`;
    }
  };
};

SCENES.merge=(n)=>{
  const cat=n.kind==='concat', C=4,H=Math.min(5,6), cell=24, gap=30;
  return {
    steps:3, view:{yaw:1.20,pitch:0.32,dist:620},
    build(s,p){
      const off=p===0?170:(p===1?90:10);
      for(let c=0;c<C;c++){
        K.plane(s,-330,110,-C*gap/2+c*gap-off/3,H,H,cell,(i,j)=>
          ({color:heat(rnd(c*13+i*3+j*7)()*2-1),alpha:.85}));
        K.plane(s,-330,110-off,-C*gap/2+c*gap+off/3,H,H,cell,(i,j)=>
          ({color:heat(rnd(c*31+i*5+j*11)()*2-1),alpha:.85}));
      }
      K.label(s,[-330+H*cell/2,150,0],'path A','#c9d4e2',12);
      K.label(s,[-330+H*cell/2,110-off-H*cell-18,0],'path B (skip)','#c9d4e2',12);
      if(p>=2){
        const OC=cat?C*2:C;
        for(let c=0;c<OC;c++)
          K.plane(s,120,110,-OC*gap/2+c*gap,H,H,cell,(i,j)=>({
            color:cat?heat(rnd((c<C?c*13:(c-C)*31)+i*3+j*7)()*2-1)
                     :heat(clamp((rnd(c*13+i*3+j*7)()+rnd(c*31+i*5+j*11)()-1),-1,1)),
            alpha:.92}));
        K.label(s,[120+H*cell/2,150,0],cat?`concatenated · ${C}+${C} channels`:`summed · ${C} channels`,'#c9d4e2',12);
        s.arrow([[-330+H*cell+15,110-H*cell/2,0],[115,110-H*cell/2,0]],'#ff8a65',{lw:2});
      }
      return cat
        ? `<span class="step">Stage ${p+1} of 3</span> — the two paths are stacked side by side:
           channel counts <b>add</b> (${C} + ${C} = ${2*C}) and nothing is blended. The next layer
           decides for itself how to weigh the two sources. This is what U-Net skips and DenseNet do,
           and it is why the layer after a concat needs a wider input than you might expect.`
        : `<span class="step">Stage ${p+1} of 3</span> — the skip path is added element-wise onto the
           block's output. Shapes must match exactly.
           <br>The real payoff is in the backward pass: addition passes gradient through
           <b>unchanged</b>, so there is a direct route from the loss all the way back to the early
           layers that bypasses this block entirely. The block therefore only has to learn a
           <i>correction</i> to the identity — and if no correction helps, driving its weights to
           zero costs nothing. That is what made 50-layer and 100-layer networks trainable.`;
    }
  };
};

SCENES.recurrent=(n)=>{
  const hs=n.params.hidden_size||64, L=5, cell=24;
  return {
    steps:L, view:{yaw:1.55,pitch:0.12,dist:560},
    build(s,p){
      for(let t=0;t<L;t++){
        const x=-280+t*130, on=t<=p, cur=t===p;
        K.plane(s,x,-60,0,1,4,cell,()=>({color:on?'#4d8bf0':'#232d3b',alpha:on?.9:.3}));
        K.label(s,[x+cell/2,-60-4*cell-16,0],`x${t+1}`,on?'#8fb8e8':'#4d5a6d',12);
        s.box([x+cell/2,40,0],[46,46,46],cur?'#4cc9f0':(on?'#2a6f8f':'#222b38'),
              {stroke:cur?'#fff':'rgba(0,0,0,.3)',lw:cur?1.8:0.6,alpha:on?1:0.35});
        K.label(s,[x+cell/2,40,26],'cell','#03202b',11);
        if(t<L-1) s.arrow([[x+cell/2+24,40,0],[x+130+cell/2-24,40,0]],
          t<p?'#4cc9f0':'#2f3d4e',{lw:t<p?2.2:1.2,alpha:t<p?1:.5});
        s.arrow([[x+cell/2,-60+4*cell*0+8,0],[x+cell/2,18,0]],on?'#4d8bf0':'#2f3d4e',{lw:1.5,alpha:on?.9:.4});
        if(on) K.plane(s,x,150,0,1,4,cell,()=>({color:'#7ed957',alpha:.85}));
        K.label(s,[x+cell/2,168,0],`h${t+1}`,on?'#a7e08a':'#4d5a6d',12);
      }
      K.label(s,[-40,-150,0],`the horizontal arrow is the entire memory: ${hs} numbers`,'#63718a',12);
      return `<span class="step">Time step ${p+1} of ${L}</span> — the cell reads input x${p+1}
        <b>and</b> the hidden state carried in from step ${p}, and produces a new hidden state
        h${p+1}. The same weights are used at every step — that is weight sharing across time.
        <br>Everything the model knows about the first ${p+1} tokens has to fit into those
        <b>${hs} numbers</b>. That fixed-size bottleneck is the whole limitation of recurrence, and
        the reason attention — which can look directly at any earlier position — displaced it.
        Note also that step ${p+1} cannot start until step ${p} is done, so this cannot be
        parallelized across time the way attention can.`;
    }
  };
};

SCENES.generic=(n)=>{
  const d=dims(n);
  return {
    steps:1, view:{yaw:1.20,pitch:0.3,dist:560},
    build(s){
      const draw=(ox,sh,lbl)=>{
        if(!sh){ s.box([ox,0,0],[40,40,40],'#2b3747',{stroke:'#3d4a5c',lw:1});
                 K.label(s,[ox,-40,0],'shape unknown','#63718a',11); return; }
        const C=Math.min(CAPC,sh[0]||1),H=Math.min(CAP,sh[1]||1),W=Math.min(CAP,sh[2]||1);
        K.stack(s,ox,90,-C*20/2,W,H,C,24,20,(i,j,c)=>({color:heat(rnd(c*7+i*3+j*5)()*2-1),alpha:.8}));
        K.label(s,[ox+W*24/2,120,0],lbl,'#c9d4e2',13);
      };
      draw(-260,d.i,`in  ${shapeStr(n.in_shape)}`);
      draw(160,d.o,`out  ${shapeStr(n.out_shape)}`);
      s.box([-40,60,0],[56,56,56],famColor(n.family),{stroke:'#fff',lw:1,alpha:.9});
      K.label(s,[-40,60,34],n.op,'#0d1117',12);
      s.arrow([[-160,60,0],[-72,60,0]],'#5d6d85',{lw:2});
      s.arrow([[-8,60,0],[150,60,0]],'#5d6d85',{lw:2});
      return `<b>${esc(n.op)}</b> — this tool has no purpose-built animation for this layer type, so
        what you see is the tensor going in and the tensor coming out.
        ${n.explain&&n.explain.what?esc(n.explain.what):''}`;
    }
  };
};

function sceneFor(n){
  const k=n.kind, f=n.family;
  if(k.startsWith('conv')) return SCENES.conv(n);
  if(k==='linear') return SCENES.linear(n);
  if(k==='maxpool'||k==='avgpool') return SCENES.pool(n);
  if(k==='globalavgpool'||k==='globalmaxpool'||k==='adaptiveavgpool'||k==='adaptivemaxpool')
    return SCENES.globalpool(n);
  if(f==='activation') return SCENES.activation(n);
  if(f==='norm') return SCENES.norm(n);
  if(k==='attention') return SCENES.attention(n);
  if(k==='embedding') return SCENES.embedding(n);
  if(k==='flatten') return SCENES.flatten(n);
  if(k==='dropout') return SCENES.dropout(n);
  if(f==='merge') return SCENES.merge(n);
  if(f==='recurrent') return SCENES.recurrent(n);
  return SCENES.generic(n);
}

/* ---- modal driver ------------------------------------------------------ */
const modal=document.getElementById('modal');
function openExpand(id){
  const n=G.byId[id]; if(!n) return;
  M.node=n; M.scene=sceneFor(n); M.step=0; M.frac=0; M.playing=M.scene.steps>1;
  document.getElementById('mti').textContent=n.op+'  ·  '+n.name;
  document.getElementById('msb').textContent=
    `${shapeStr(n.in_shape)} → ${shapeStr(n.out_shape)}   ·   ${fmt(n.n_params)} params`;
  document.getElementById('m-play').textContent=M.playing?'Pause':'Play';
  modal.classList.add('on');
  const v=M.scene.view||{};
  MR.cam.yaw=v.yaw??1.2; MR.cam.pitch=v.pitch??0.3; MR.cam.dist=v.dist??600;
  MR.cam.target=[0,0,0]; MR.cam.ortho=false;
  mResize(); frameScene(); M.last=performance.now();
  if(!M.raf) M.raf=requestAnimationFrame(mFrame);
}
function closeExpand(){
  modal.classList.remove('on');
  if(M.raf){cancelAnimationFrame(M.raf);M.raf=null;}
  M.node=null;
}
/* centre and zoom the modal camera on whatever the scene actually drew,
   so no scene needs its distance hand-tuned */
function frameScene(){
  const probe=new Scene();
  try{ M.scene.build(probe,0,0); }catch(e){ return; }
  const mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  const acc=p=>{ for(let i=0;i<3;i++){ if(typeof p[i]!=='number'||!isFinite(p[i])) return;
                   mn[i]=Math.min(mn[i],p[i]); mx[i]=Math.max(mx[i],p[i]); } };
  for(const it of probe.items){
    if(it.t==='box') it.cs.forEach(acc);
    else if(it.points) it.points.forEach(acc);
    else if(it.pos) acc(it.pos);
  }
  if(mn[0]>mx[0]) return;
  MR.cam.target=[0,1,2].map(i=>(mn[i]+mx[i])/2);
  const aspect=Math.max(1,(MR.W||1200)/(MR.H||600));
  const span=Math.max(mx[0]-mn[0], (mx[1]-mn[1])*aspect, (mx[2]-mn[2])*1.6);
  MR.cam.dist=clamp(span*0.64+60,110,4000);
}
function mResize(){
  if(!modal.classList.contains('on')) return;
  const box=document.getElementById('mcv').getBoundingClientRect();
  mcv.style.width=box.width+'px'; mcv.style.height=box.height+'px';
  MR.resize();
}
function mFrame(now){
  M.raf=requestAnimationFrame(mFrame);
  if(!M.node) return;
  const dt=Math.min(0.1,(now-M.last)/1000); M.last=now;
  if(M.playing&&M.scene.steps>1){
    M.frac+=dt*M.speed*0.85;
    while(M.frac>=1){ M.frac-=1; M.step=(M.step+1)%M.scene.steps; }
  }
  const s=new Scene();
  const cap=M.scene.build(s,M.step,M.frac);
  MR.draw(s);
  document.getElementById('mcap').innerHTML=cap;
}
document.getElementById('m-close').onclick=closeExpand;
document.getElementById('m-play').onclick=e=>{
  M.playing=!M.playing; e.target.textContent=M.playing?'Pause':'Play'; };
document.getElementById('m-step').onclick=()=>{
  M.playing=false; document.getElementById('m-play').textContent='Play';
  M.step=(M.step+1)%M.scene.steps; M.frac=0; };
document.getElementById('m-reset').onclick=()=>{ M.step=0; M.frac=0; };
document.getElementById('m-speed').onchange=e=>{ M.speed=+e.target.value; };
modal.addEventListener('click',e=>{ if(e.target===modal) closeExpand(); });
/* orbit inside the modal */
let mdrag=null;
mcv.addEventListener('pointerdown',e=>{mcv.setPointerCapture(e.pointerId);
  mdrag={x:e.clientX,y:e.clientY,pan:e.shiftKey};});
mcv.addEventListener('pointermove',e=>{
  if(!mdrag) return;
  const dx=e.clientX-mdrag.x, dy=e.clientY-mdrag.y, c=MR.cam;
  if(mdrag.pan){ const k=c.dist*0.0016;
    c.target=V.add(c.target,V.add(V.mul(c.rgt,-dx*k),V.mul(c.up,dy*k))); }
  else { c.yaw+=dx*0.006; c.pitch=clamp(c.pitch+dy*0.005,-1.45,1.45); }
  mdrag.x=e.clientX; mdrag.y=e.clientY;});
mcv.addEventListener('pointerup',()=>{mdrag=null;});
mcv.addEventListener('wheel',e=>{e.preventDefault();
  MR.cam.dist=clamp(MR.cam.dist*Math.exp(e.deltaY*0.0012),80,4000);},{passive:false});

/* ---------- boot -------------------------------------------------------- */
function header(){
  const m=G.graph.meta;
  document.getElementById('b-fw').textContent=m.framework;
  document.getElementById('b-fmt').textContent=m.format;
  document.getElementById('stats').innerHTML=
    `<span class="stat"><b>${m.n_nodes}</b> layers</span>`+
    `<span class="stat"><b>${fmt(m.total_params)}</b> params</span>`+
    (m.total_macs?`<span class="stat" title="${G.approx?'derived from computed shapes — see the banner':''}">`+
      `<b>${G.approx?'~':''}${fmt(m.total_macs)}</b> MACs</span>`:'')+
    `<span class="stat">${shapeStr(m.input_shape)} → ${shapeStr(m.output_shape)}</span>`;
  document.title='netviz3d · '+(m.source||'model');
  const warn=(G.graph.warnings||[]);
  const note=document.getElementById('note');
  const body=(m.summary?`<b>${esc(m.summary)}</b>`:'')+
    (warn.length?'<br>'+warn.map(w=>'▲ '+esc(w)).join('<br>'):'');
  if(body){
    note.innerHTML=`<button title="dismiss">✕</button>${body}`;
    note.classList.add('on');
    note.querySelector('button').onclick=()=>note.classList.remove('on');
  }
}
function start(graph){
  document.getElementById('loader').style.display='none';
  ingest(graph); header(); buildList(); buildLegend();
  R.resize(); fit(false); mark();
  if(!G.nodes.length) return;
  requestAnimationFrame(frame);
}
function failed(msg,detail){
  document.getElementById('loader').innerHTML=
    `<div style="color:var(--warn);font-size:14px">${esc(msg)}</div>`+
    (detail?`<div style="max-width:520px">${esc(detail)}</div>`:'')+
    `<div style="margin-top:8px">Start it with <code>python server.py your_model.pt</code></div>`;
}
if(window.__NETVIZ_GRAPH__){
  start(window.__NETVIZ_GRAPH__);
} else {
  fetch('api/graph').then(r=>r.json().then(j=>({ok:r.ok,j}))).then(({ok,j})=>{
    if(!ok||j.error) failed('Could not load a model.',j.error||'');
    else start(j);
  }).catch(e=>failed('No backend reachable.',
    'This page was opened directly from disk without a graph baked into it. '+
    'Either run the server, or build a self-contained file with --standalone.'));
}
</script>
