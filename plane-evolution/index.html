<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3d8fe0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Plane Evolution</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root { --ui: #ffffff; --ink: #1d2433; --gold: #ffc233; --good: #2fbf71; --bad: #e0524b; --panel: rgba(18, 28, 48, .88); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3d8fe0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ui); touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; position: fixed; inset: 0; }
  .hidden { display: none !important; }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; }

  /* top bar */
  #topbar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: max(10px, env(safe-area-inset-top)) 12px 10px; pointer-events: none; }
  .pill { background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 6px; pointer-events: auto; }
  .coin { display: inline-block; width: 1em; height: 1em; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff4b0, var(--gold) 45%, #c98a00); box-shadow: 0 0 0 2px #a86f00 inset; vertical-align: -0.12em; }
  #topbar .spacer { flex: 1; }
  .iconbtn { background: var(--panel); border-radius: 50%; width: 38px; height: 38px; font-size: 18px; pointer-events: auto; display: grid; place-items: center; }

  /* hangar */
  #hangar { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 10px max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #planeTitle { text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,.45); }
  #planeTitle .name { font-size: 26px; font-weight: 900; letter-spacing: .5px; }
  #planeTitle .sub { font-size: 13px; opacity: .92; }
  #chips { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; width: 100%; max-width: 900px; }
  .chip { background: var(--panel); border-radius: 12px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; border: 2px solid transparent; font-size: 12px; font-weight: 800; min-width: 0; }
  .chip .ic { font-size: 20px; line-height: 1.15; }
  .chip .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .chip .lv { font-size: 11px; opacity: .8; font-weight: 600; white-space: nowrap; }
  .chip.sel { border-color: var(--gold); background: rgba(40, 56, 90, .96); }
  .chip.afford::after { content: ''; position: absolute; top: 5px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #3ecf80; box-shadow: 0 0 6px #3ecf80; }
  .chip.locked { opacity: .55; }
  .chip.maxed .lv { color: #c9b3ff; }
  #detail { background: var(--panel); border-radius: 14px; padding: 10px 12px; width: 100%; max-width: 900px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 14px; align-items: center; }
  #detail .dh { font-weight: 800; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  #detail .dh .lv { font-size: 12px; opacity: .75; font-weight: 600; }
  #detail .look, #detail .eff { font-size: 13px; line-height: 1.35; }
  #detail .look b { color: #ffe08a; }
  #detail .eff b { color: #9fe39f; }
  #detail .desc { opacity: .72; font-size: 12px; line-height: 1.35; }
  #upBtn { grid-column: 2; grid-row: 1 / span 4; min-width: 180px; background: linear-gradient(#3ecf80, #22a45e); border-radius: 12px; padding: 12px 14px; font-weight: 900; font-size: 16px; box-shadow: 0 4px 0 #16723f; white-space: nowrap; }
  #upBtn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #16723f; }
  #upBtn:disabled { background: #4a5468; box-shadow: 0 4px 0 #2e3544; color: #b8c0d0; cursor: default; }
  #upBtn.max { background: #6c5a9e; box-shadow: 0 4px 0 #463872; color: #fff; }
  #actions { display: flex; gap: 10px; width: 100%; max-width: 900px; }
  .big { flex: 1; border-radius: 16px; padding: 14px; font-size: 22px; font-weight: 900; letter-spacing: 1px; }
  #flyBtn { background: linear-gradient(#ffcf4d, #f5a300); color: #4a2a00; box-shadow: 0 5px 0 #b87400; }
  #flyBtn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b87400; }
  @keyframes pulse { 50% { filter: brightness(1.2); transform: scale(1.02); } }

  /* flight HUD */
  #hud { position: fixed; top: 0; left: 0; right: 0; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) 12px 0; display: flex; flex-direction: column; align-items: center; }
  #hudDist { font-size: 40px; font-weight: 900; text-shadow: 0 3px 8px rgba(0,0,0,.45); line-height: 1; margin-top: 44px; }
  #hudRow { display: flex; gap: 8px; margin-top: 6px; font-size: 13px; font-weight: 700; flex-wrap: wrap; justify-content: center; }
  #hudRow .pill { pointer-events: none; }
  #fuelWrap { width: min(260px, 60vw); height: 12px; background: rgba(0,0,0,.35); border-radius: 99px; overflow: hidden; margin-top: 8px; border: 2px solid rgba(255,255,255,.5); }
  #fuelBar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff7a3d, #ffd23d); }
  #reserveWrap { width: min(260px, 60vw); height: 8px; background: rgba(0,0,0,.35); border-radius: 99px; overflow: hidden; margin-top: 4px; border: 2px solid rgba(160,220,255,.6); }
  #reserveBar { height: 100%; width: 100%; background: linear-gradient(90deg, #3d8bff, #7de8ff); }
  #reserveWrap.on { box-shadow: 0 0 10px #7de8ff; }
  #flightBtns { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: max(10px, env(safe-area-inset-top)) 12px 0; pointer-events: none; }
  #flightBtns .iconbtn { width: 42px; height: 42px; font-size: 18px; font-weight: 900; }

  /* flight controls */
  #ctls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px max(14px, env(safe-area-inset-bottom)); pointer-events: none; }
  .ctl { pointer-events: auto; width: 84px; height: 84px; border-radius: 50%; background: rgba(18, 28, 48, .55); border: 3px solid rgba(255,255,255,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; line-height: 1; touch-action: none; }
  .ctl small { font-size: 10px; letter-spacing: 1px; margin-top: 4px; opacity: .85; }
  .ctl.active { background: rgba(255,255,255,.35); transform: scale(.95); }
  .ctl.res { width: auto; height: 60px; border-radius: 16px; padding: 0 16px; font-size: 15px; margin-bottom: 12px; opacity: .45; border-color: rgba(125,232,255,.7); }
  .ctl.res.ready { opacity: 1; background: rgba(40, 110, 200, .7); animation: pulse 1s infinite; }
  .ctl.res.active { animation: none; background: rgba(125,232,255,.6); }
  #hint { position: fixed; bottom: 16%; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,.5); pointer-events: none; animation: bob 1s infinite ease-in-out; }
  @keyframes bob { 50% { transform: translateY(-6px); } }

  /* launch meter */
  #launchUI { position: fixed; left: 0; right: 0; bottom: 18%; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; }
  #meter { width: min(360px, 80vw); height: 26px; border-radius: 99px; background: linear-gradient(90deg, #e0524b 0%, #ffb13d 55%, #7ee07e 84%, #2fbf71 85%, #2fbf71 100%); border: 3px solid #fff; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,.3); }
  #needle { position: absolute; top: -8px; bottom: -8px; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 0 2px #1d2433; }
  #launchUI .t { font-size: 22px; font-weight: 900; text-shadow: 0 2px 6px rgba(0,0,0,.5); }

  /* area title, in the style of a souls-like "area reached" banner */
  #areaTitle { position: fixed; left: 0; right: 0; top: 36%; text-align: center; pointer-events: none; opacity: 0; transition: opacity 1.4s ease;
    padding: 26px 0 22px; background: linear-gradient(transparent, rgba(0,0,0,.42) 28%, rgba(0,0,0,.42) 72%, transparent);
    font-family: "Palatino Linotype", "Book Antiqua", Palatino, "Iowan Old Style", Georgia, "Times New Roman", serif; }
  #areaTitle.show { opacity: 1; transition-duration: .9s; }
  #areaTitle .sub { font-size: 13px; letter-spacing: .55em; text-transform: uppercase; color: #d9c9a3; margin-bottom: 8px; min-height: 1em; }
  #areaTitle .name { font-size: clamp(30px, 6.2vw, 62px); letter-spacing: .14em; color: #f4ecd8; font-weight: 400; text-shadow: 0 0 22px rgba(0,0,0,.85), 0 2px 4px rgba(0,0,0,.9); text-transform: uppercase; padding: 0 12px; }
  #areaTitle .line { width: min(600px, 84vw); height: 1px; margin: 12px auto 0; background: linear-gradient(90deg, transparent, rgba(244,236,216,.95), transparent); }

  /* popups */
  #toast { position: fixed; top: 22%; left: 0; right: 0; text-align: center; font-size: 32px; font-weight: 900; pointer-events: none; text-shadow: 0 3px 10px rgba(0,0,0,.5); opacity: 0; transition: opacity .25s, transform .25s; padding: 0 10px; }
  #toast.show { opacity: 1; transform: scale(1.08); }
  .modalBg { position: fixed; inset: 0; background: rgba(8, 14, 28, .55); display: grid; place-items: center; padding: 16px; }
  .modal { background: #1b2740; border-radius: 20px; padding: 20px; width: min(380px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.5); text-align: center; }
  .modal h2 { margin: 0 0 12px; font-size: 26px; }
  .modal .row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 15px; text-align: left; }
  .modal .row b { font-weight: 800; white-space: nowrap; }
  .modal .total { font-size: 28px; font-weight: 900; margin: 14px 0 4px; color: var(--gold); }
  .modal .nb { color: var(--gold); font-weight: 900; font-size: 18px; margin-bottom: 6px; }
  .modal .btns { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .modal .btns button { border-radius: 12px; padding: 12px; font-weight: 800; font-size: 16px; background: #34486e; }
  .modal .btns button.primary { background: linear-gradient(#3ecf80, #22a45e); box-shadow: 0 4px 0 #16723f; font-size: 19px; }
  .modal .btns button.danger { background: #7d2f2c; }
  .modal p { opacity: .85; font-size: 14px; line-height: 1.45; margin: 6px 0; }
  .modal textarea { width: 100%; height: 90px; border-radius: 10px; border: 0; padding: 8px; font-family: ui-monospace, monospace; font-size: 11px; background: #0e1627; color: #cfe; resize: none; user-select: text; -webkit-user-select: text; }
  .toggles { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; background: #26365a; border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 15px; }
  .toggle .sw { width: 46px; height: 26px; border-radius: 99px; background: #4a5468; position: relative; transition: background .2s; flex: none; }
  .toggle .sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .2s; }
  .toggle.on .sw { background: #2fbf71; }
  .toggle.on .sw::after { left: 23px; }

  @media (max-width: 640px) {
    #chips { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #detail { grid-template-columns: minmax(0, 1fr); }
    #upBtn { grid-column: 1; grid-row: auto; width: 100%; margin-top: 4px; padding: 10px; }
    .pill { padding: 6px 10px; font-size: 14px; }
    #planeTitle .name { font-size: 22px; }
    .big { padding: 12px; font-size: 20px; }
  }
  @media (max-height: 560px) {
    #planeTitle .sub, #detail .desc { display: none; }
    #hangar { gap: 6px; }
    .chip { padding: 4px 2px; }
    .chip .ic { font-size: 16px; }
    .big { padding: 10px; font-size: 19px; }
    #upBtn { padding: 9px 12px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topbar">
  <div class="pill"><span class="coin"></span><span id="coins">0</span></div>
  <div class="pill" id="bestPill">🏁 <span id="best">0 m</span></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="soundBtn" title="Sound">🔊</button>
  <button class="iconbtn" id="menuBtn" title="Settings">⚙️</button>
</div>

<div id="hangar">
  <div id="planeTitle">
    <div class="name" id="planeName">Paper Plane</div>
    <div class="sub" id="planeSub"></div>
  </div>
  <div id="chips"></div>
  <div id="detail">
    <div class="dh"><span id="dIcon"></span><span id="dName"></span><span class="lv" id="dLv"></span></div>
    <div class="look" id="dLook"></div>
    <div class="eff" id="dEff"></div>
    <div class="desc" id="dDesc"></div>
    <button id="upBtn">Upgrade</button>
  </div>
  <div id="actions">
    <button class="big" id="flyBtn">FLY!</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="hudDist">0 m</div>
  <div id="hudRow">
    <div class="pill">⬆ <span id="hudAlt">0 m</span></div>
    <div class="pill">💨 <span id="hudSpd">0 km/h</span></div>
    <div class="pill"><span class="coin"></span> <span id="hudCoins">0</span></div>
  </div>
  <div id="fuelWrap"><div id="fuelBar"></div></div>
  <div id="reserveWrap" class="hidden"><div id="reserveBar"></div></div>
</div>
<div id="flightBtns" class="hidden">
  <button class="iconbtn" id="pauseBtn" title="Pause (Esc)">❚❚</button>
  <button class="iconbtn" id="quitBtn" title="Exit to hangar">✕</button>
</div>
<div id="ctls" class="hidden">
  <div class="ctl" data-role="down">▼<small>DIVE</small></div>
  <div class="ctl res hidden" data-role="reserve" id="ctlRes">RESERVE<small id="resTxt">SPACE</small></div>
  <div class="ctl" data-role="up">▲<small>CLIMB</small></div>
</div>
<div id="hint" class="hidden"></div>

<div id="launchUI" class="hidden">
  <div class="t">Tap to launch!</div>
  <div id="meter"><div id="needle"></div></div>
</div>

<div id="areaTitle"><div class="sub" id="areaSub"></div><div class="name" id="areaName"></div><div class="line"></div></div>
<div id="toast"></div>

<div class="modalBg hidden" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
'use strict';
/* ==========================================================================
   Plane Evolution — offline, ad-free launch-and-glide plane game.
   Everything (art, physics, save) lives in this one file.
   ========================================================================== */

const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
}
addEventListener('resize', resize); resize();

/* ---------- plane parts ----------
   Every part is levelled on its own. Each level changes the part's look a little
   (size, livery stripes); every few levels it changes shape/material ("look stage"). */
const LOOKS = {
  frame:   ['Paper Plane', 'Balsa Glider', 'Barnstormer', 'Prop Plane', 'Jet Fighter', 'Supersonic Jet', 'Rocket Plane', 'Space Shuttle', 'Starfighter', 'UFO', 'Singularity'],
  wings:   ['Paper folds', 'Balsa wings', 'Biplane wings', 'Aluminium wings', 'Swept wings', 'Delta wings', 'Titanium delta', 'Heat-tiled delta', 'Forward-swept blades', 'Alien fins', 'Void sails'],
  engine:  ['Rubber band', 'Wooden propeller', 'Three-blade prop', 'Radial engine', 'Turbojet', 'Afterburner', 'Twin afterburners', 'Rocket motor', 'Triple rocket', 'Ion drive', 'Plasma core'],
  fuel:    ['Soda bottle', 'Belly tank', 'Big belly tank', 'Drop tank', 'Twin drop tanks', 'Conformal tanks', 'Cryo tanks', 'Rocket-fuel pods', 'Antimatter cells', 'Dark-matter cells', 'Singularity cell'],
  tail:    ['Paper fin', 'Wooden fin', 'Swept fin', 'Twin fins', 'Canted twin fins', 'Vector vanes'],
  nose:    ['Cardboard tip', 'Rubber bumper', 'Steel cone', 'Pitot spike', 'Titanium ram', 'Force shield'],
  magnet:  ['Fridge magnet', 'Horseshoe magnet', 'Big horseshoe', 'Coil magnet', 'Radar dish', 'Twin dishes', 'Tractor emitter', 'Gravity orb', 'Graviton ring', 'Quantum lure', 'Wealth singularity'],
  reserve: ['Spare canister', 'Reserve pod', 'Twin pods', 'Cryo reserve', 'Plasma reserve', 'Quantum reserve', 'Infinity reserve'],
};
const PARTS = [
  { id: 'frame',   name: 'Frame',   icon: '🛩️', base: 12,   g: 1.26, max: 50, step: 5, desc: 'The body of the plane. A stronger, lighter frame survives a harder catapult launch.' },
  { id: 'wings',   name: 'Wings',   icon: '🪶', base: 16,   g: 1.26, max: 50, step: 5, desc: 'Better wings glide further and cut drag, raising top speed.' },
  { id: 'engine',  name: 'Engine',  icon: '⚙️', base: 20,   g: 1.26, max: 50, step: 5, install: true, desc: 'Thrust while fuel lasts. More power means a higher top speed.' },
  { id: 'fuel',    name: 'Fuel',    icon: '⛽', base: 16,   g: 1.26, max: 50, step: 5, install: true, desc: 'How long the engine burns before it runs dry.' },
  { id: 'tail',    name: 'Tail',    icon: '🧭', base: 80,   g: 1.42, max: 20, step: 4, install: true, desc: 'Steering. Climb and dive faster for sharper flying.' },
  { id: 'nose',    name: 'Nose',    icon: '🛡️', base: 60,   g: 1.42, max: 20, step: 4, install: true, desc: 'Armoured nose cone. Birds and balloons slow you down less.' },
  { id: 'magnet',  name: 'Magnet',  icon: '🧲', base: 30,   g: 1.26, max: 50, step: 5, install: true, desc: 'Coins are worth more, and you grab them from further away.' },
  { id: 'reserve', name: 'Reserve', icon: '🛢️', base: 2500, g: 1.30, max: 30, step: 5, install: true, req: p => p.engine >= 20, reqText: 'Engine Lv 20',
    desc: 'Backup fuel. Once the main tank is empty, hold Space (or RESERVE) to burn it. Upgrades slow the drain.' },
];
const PART = Object.fromEntries(PARTS.map(p => [p.id, p]));
const stageOf = (id, lvl) => Math.min(LOOKS[id].length - 1, Math.floor(lvl / PART[id].step));
const lookName = (id, lvl) => lvl === 0 && PART[id].install ? 'Not installed' : LOOKS[id][stageOf(id, lvl)];
const partCost = (id, lvl) => Math.ceil(PART[id].base * Math.pow(PART[id].g, lvl));
const FRAME_TAGS = ['Folded from last week\'s homework.', 'Light wood, long wings, big dreams.', 'Fabric, wire and nerve.', 'A proper aeroplane.', 'Afterburners online.',
  'Breakfast in London, lunch in New York.', 'Barely a plane anymore.', 'Next stop: orbit.', 'Built for the space lanes.', 'Where did you even get this?', 'It bends light a little.'];
const MILESTONES = [100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];

/* Materials by look stage: base, dark, light, accent */
const MAT = [
  { base: '#f4f6f8', dark: '#c3cedb', light: '#ffffff', accent: '#6b8ab5' }, // paper
  { base: '#dcae74', dark: '#a97b44', light: '#f0cf9c', accent: '#7a4f25' }, // balsa
  { base: '#d8433b', dark: '#962821', light: '#f07a6e', accent: '#f3e3c3' }, // fabric
  { base: '#f2c230', dark: '#b88e12', light: '#ffe07a', accent: '#1f5fa8' }, // aluminium
  { base: '#8795a6', dark: '#556171', light: '#b5c1cf', accent: '#3aa0ff' }, // titanium
  { base: '#eef1f5', dark: '#aab3c0', light: '#ffffff', accent: '#1a3a7a' }, // composite
  { base: '#2b2e37', dark: '#15171c', light: '#4a4f5c', accent: '#ffcc00' }, // heat shield
  { base: '#f3f2ec', dark: '#bdbcb4', light: '#ffffff', accent: '#222222' }, // ceramic
  { base: '#34467e', dark: '#1c2750', light: '#5a70b8', accent: '#ff4fd8' }, // starfighter
  { base: '#b9c3d3', dark: '#7b8598', light: '#e8eef8', accent: '#7dffa8' }, // chrome
  { base: '#2a1a4a', dark: '#0c0618', light: '#4a2d80', accent: '#c77dff' }, // void
];

/* ---------- terrains ---------- */
const BIOMES = [
  { at: 0,     name: 'Verdant Meadow',    key: 'meadow',  skyTop: '#3d8fe0', skyBot: '#c4e8ff', ground: '#6cc24a', dirt: '#4a8a32', hillA: '#7cb866', hillB: '#5a9a52', far: '#8fbad6',
    style: 'rolling', weather: 'clear', cloud: '#ffffff', cover: 0.22, stars: 0,   sun: { c: '#fff6c8', r: 34, y: 0.16 } },
  { at: 400,   name: 'Amber Farmlands',   key: 'farm',    skyTop: '#62758f', skyBot: '#cfd6de', ground: '#b3bd4a', dirt: '#857f33', hillA: '#96a45a', hillB: '#768644', far: '#9aa8b6',
    style: 'rolling', weather: 'rain',  cloud: '#8a94a3', cover: 0.5,  stars: 0,   sun: null },
  { at: 1500,  name: 'Sunscorch Desert',  key: 'desert',  skyTop: '#e38f45', skyBot: '#ffe4ae', ground: '#edc978', dirt: '#c49a4e', hillA: '#e2b36b', hillB: '#c98f4a', far: '#eebd8e',
    style: 'dunes',   weather: 'dust',  cloud: '#fff0da', cover: 0.07, stars: 0,   sun: { c: '#fffbe8', r: 50, y: 0.2 } },
  { at: 4000,  name: 'Frostveil Tundra',  key: 'tundra',  skyTop: '#0f1a3e', skyBot: '#6d84b2', ground: '#eef5f8', dirt: '#b3c6d3', hillA: '#dbe6ef', hillB: '#9fb3c6', far: '#56699a',

/* ---------- save ----------

  g.fillStyle = 'rgba(0,0,0,.35)'; for (let i = 0; i < lv; i++) g.fillRect(x + 1.5 + i * 1.7, y - hh * 0.8, 0.8, hh * 1.6);
  if (s >= 3) { const L = 5 + N * 0.3; g.strokeStyle = '#555'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x + nl + 3, y); g.lineTo(x + nl + 3 + L, y); g.stroke(); g.fillStyle = '#e04b3b'; g.beginPath(); g.arc(x + nl + 3 + L, y, 1.2, 0, 7); g.fill(); }

    g.strokeStyle = bc; g.lineWidth = 2.6;

/* ---------- world objects ---------- */
// Items are generated per chunk from a deterministic seed so a run is stable while you fly.
function makeWorld(st) {
  const scale = Math.max(1, st.Sv);
  const CH = 45 * scale;
  const chunks = new Map();
  const runSeed = (Math.random() * 1e9) | 0;
  function chunk(i) {
    if (chunks.has(i)) return chunks.get(i);
    const r = rng(runSeed + i * 7919), items = [];
    if (i >= 0) {
      const x0 = i * CH + (i === 0 ? 14 * scale : 0);
      const ceil = (18 + Math.min(i * 3, 160)) * scale;
      const roll = r();
      if (roll < 0.58) {
        const n = 5 + Math.floor(r() * 5), y0 = (3 + r() * ceil), step = 4 * scale, amp = (2 + r() * 6) * scale;
        const sx = x0 + r() * CH * 0.4;
        for (let k = 0; k < n; k++) items.push({ k: 'coin', x: sx + k * step, y: y0 + Math.sin(k / (n - 1) * Math.PI) * amp });
      } else if (roll < 0.72) {
        items.push({ k: 'ring', x: x0 + r() * CH * 0.6, y: 6 * scale + r() * ceil * 0.8 });
      } else if (roll < 0.83) {
        items.push({ k: st.thrust > 0 ? 'fuel' : 'coin', x: x0 + r() * CH * 0.6, y: 4 * scale + r() * ceil * 0.8 });
      } else {
        const k = r() < 0.5 ? 'bird' : 'balloon';
        items.push({ k, x: x0 + r() * CH * 0.7, y: 5 * scale + r() * ceil * 0.9, ph: r() * 6, hue: r() });
      }
      if (r() < 0.25) items.push({ k: 'coin', x: x0 + r() * CH, y: 2 * scale + r() * 10 * scale });
    }
    chunks.set(i, items);
    if (chunks.size > 120) { const first = chunks.keys().next().value; chunks.delete(first); }
    return items;
  }
  return { CH, chunk, scale };
}

/* ---------- game state ---------- */
let mode = 'hangar'; // hangar | launch | fly | done
let paused = false;
let P = null, world = null, runSt = null;
let meterT = 0, camZ = 6, camX = 0, camOff = 0, time = 0, hangarT = 0;
let particles = [], floaters = [];
let run = null;
let selPart = 'frame';

function newRun() {
  runSt = curStats();
  world = makeWorld(runSt);
  P = { x: 0, y: 2.2, a: 0.45, v: 0, fuel: runSt.fuel, reserve: runSt.reserve, reserveOn: false, maxY: 0, maxV: 0, grounded: false, stopT: 0, crashed: false };
  run = { reserveToast: false, coins: 0, rings: 0, t: 0, taken: new Set(), hintT: 0, power: 1, area: 0 };
  camX = 0; camOff = 0; camZ = clamp(Math.min(W, H * 1.6) / 60, 3, 12);
  particles = []; floaters = [];
}

/* ---------- controls ---------- */
// keys: 'up' | 'down' | 'reserve' held on the keyboard; ptrs: pointerId -> role
const ctl = { keys: new Set(), ptrs: new Map() };
const ctlOn = role => ctl.keys.has(role) || [...ctl.ptrs.values()].includes(role);

/* ---------- physics ---------- */
function physStep(dt) {
  const st = runSt;
  if (!P.grounded) {
    const up = ctlOn('up'), down = ctlOn('down');
    if (up && !down) P.a = Math.min(1.0, P.a + st.pitch * dt);
    else if (down && !up) P.a = Math.max(-1.1, P.a - st.pitch * dt);
    else if (P.a > -0.35) P.a = Math.max(-0.35, P.a - 0.6 * dt);
    else P.a += 0.4 * dt;
    if (P.v < 7) P.a -= (7 - P.v) * 0.22 * dt; // stall: nose drops
    P.a = clamp(P.a, -1.3, 1.0);
    let T = 0;
    P.reserveOn = false;
    if (P.fuel > 0 && st.thrust > 0) { T = st.thrust; P.fuel -= dt; }
    else if (P.reserve > 0 && ctlOn('reserve')) { T = st.thrust; P.reserve -= dt; P.reserveOn = true; }
    P.thrusting = T > 0;
    P.v += (T - 9.8 * Math.sin(P.a) - st.drag * P.v * P.v) * dt;
    if (P.v < 0.3) P.v = 0.3;
    const sink = P.v * Math.cos(P.a) / st.ld + st.ind / (P.v * P.v + 4);
    const ox = P.x, oy = P.y;
    P.x += P.v * Math.cos(P.a) * dt;
    P.y += (P.v * Math.sin(P.a) - sink) * dt;
    P.maxY = Math.max(P.maxY, P.y); P.maxV = Math.max(P.maxV, P.v);
    collide(ox, oy);
    if (P.y <= 0) {
      P.y = 0; P.grounded = true;
      const vy = P.v * Math.sin(P.a);
      P.crashed = vy < -Math.max(14, P.v * 0.5);
      P.v = P.v * Math.cos(P.a) * (P.crashed ? 0.25 : 0.8);
      P.a = 0; P.thrusting = false; P.reserveOn = false;
      sfx.land(); shake = P.crashed ? 14 : 5;
      const dust = css(mixA(rgb(BIOMES[biomeIndex(P.x)].dirt), [150, 128, 100], 0.6));
      for (let i = 0; i < 18; i++) particles.push({ x: P.x, y: 0.3, vx: (Math.random() - .3) * P.v * .4 + 2, vy: Math.random() * 6 * world.scale, life: 1, c: dust, r: 3 + Math.random() * 4 });
      if (P.crashed) showToast('CRASH!', '#ff8a7a');
    }
  } else {
    const fr = 12 * Math.max(1, world.scale * 0.5);
    P.v = Math.max(0, P.v - fr * dt);
    P.x += P.v * dt; P.thrusting = false;
    if (P.v < 0.5) P.stopT += dt;
  }
}

function collide(ox, oy) {
  // segment-vs-point test so fast planes never skip items
  const R = Math.max(2.2 * world.scale, 26 / camZ);
  const i0 = Math.floor(Math.min(ox, P.x) / world.CH), i1 = Math.floor(Math.max(ox, P.x) / world.CH);
  const dx = P.x - ox, dy = P.y - oy, L2 = dx * dx + dy * dy || 1;
  for (let i = i0 - 1; i <= i1 + 1; i++) {
    const items = world.chunk(i);
    for (let j = 0; j < items.length; j++) {
      const it = items[j]; const key = i * 64 + j;
      if (run.taken.has(key)) continue;
      const t = clamp(((it.x - ox) * dx + (it.y - oy) * dy) / L2, 0, 1);
      const ex = ox + dx * t - it.x, ey = oy + dy * t - it.y;
      const rr = it.k === 'ring' ? R * 1.9 : it.k === 'coin' ? R * 1.1 * runSt.magnetR : R;
      if (ex * ex + ey * ey > rr * rr) continue;
      run.taken.add(key);
      if (it.k === 'coin') {
        const v = Math.ceil(runSt.income * world.scale * 1.6 * (1 + it.x / (500 * world.scale)));
        run.coins += v; sfx.coin(); floaters.push({ x: it.x, y: it.y, txt: '+' + fmt(v), c: '#ffd23d', life: 1 });
        for (let k = 0; k < 5; k++) particles.push({ x: it.x, y: it.y, vx: (Math.random() - .5) * 8 * world.scale, vy: (Math.random() - .2) * 8 * world.scale, life: 0.6, c: '#fff4b0', r: 2 });
      } else if (it.k === 'ring') {
        P.v += 7 * world.scale + P.v * 0.12; run.rings++; sfx.ring();
        floaters.push({ x: it.x, y: it.y, txt: 'BOOST!', c: '#7dfcff', life: 1 });
      } else if (it.k === 'fuel') {
        // Once the main tank is dry, cans top up the reserve instead, so they never re-open the
        // main tank and lock the reserve out again.
        if (P.fuel <= 0 && runSt.reserve > 0) {
          P.reserve = Math.min(runSt.reserve, Math.max(0, P.reserve) + 1.5);
          floaters.push({ x: it.x, y: it.y, txt: '+RESERVE', c: '#7de8ff', life: 1 });
        } else {
          P.fuel = Math.min(runSt.fuel, P.fuel + 1.5);
          floaters.push({ x: it.x, y: it.y, txt: '+FUEL', c: '#ffa94d', life: 1 });
        }

      } else {

        floaters.push({ x: it.x, y: it.y, txt: it.k === 'bird' ? 'BONK!' : 'POP!', c: '#ff8a7a', life: 1 });
        for (let k = 0; k < 10; k++) particles.push({ x: it.x, y: it.y, vx: (Math.random() - .5) * 20, vy: (Math.random() - .5) * 20, life: 1, c: it.k === 'bird' ? '#fff' : '#ff5a7a', r: 3 });

/* ==========================================================================
   Environment: sky, stars, weather, hills, ground
   ========================================================================== */
let shake = 0, flash = 0, shooting = null;
const toScreen = (x, y) => [(x - camX) * camZ + W * 0.32, H * 0.78 - y * camZ + camOff];
const STARS = Array.from({ length: 260 }, (_, i) => ({ x: hash(i * 3 + 1), y: hash(i * 3 + 2), r: 0.4 + Math.pow(hash(i * 7 + 5), 3) * 1.8, tw: hash(i * 11 + 3) * 6.28,
  c: hash(i * 13 + 1) < 0.14 ? [255, 214, 170] : hash(i * 13 + 1) < 0.3 ? [180, 205, 255] : [255, 255, 255] }));
const WX = Array.from({ length: 170 }, () => ({ x: Math.random() * 3000, y: Math.random() * 2000, r: Math.random(), s: Math.random() }));
const WEATHER_DENSITY = { clear: 0.12, rain: 0.95, dust: 0.55, snow: 0.8, ash: 0.7, spores: 0.35 };

function envAt(x) {
  const i = biomeIndex(x), a = BIOMES[i], b = BIOMES[i + 1];
  if (!b) return { i, a, b: a, t: 0 };
  const win = Math.min(260 * (world ? world.scale : 1), (b.at - a.at) * 0.3); // blend into the next terrain
  return { i, a, b, t: clamp((x - (b.at - win)) / win, 0, 1) };
}
const envMix = (e, key) => mixA(rgb(e.a[key]), rgb(e.b[key]), e.t);
const envNum = (e, key) => lerp(e.a[key] || 0, e.b[key] || 0, e.t);
const envFlag = (e, key) => (e.a[key] ? 1 - e.t : 0) + (e.b[key] ? e.t : 0);

function hillHeight(style, u) {
  const tri = v => Math.abs(((v % 2) + 2) % 2 - 1);
  switch (style) {
    case 'dunes': return 0.3 + 0.32 * Math.pow(Math.abs(Math.sin(u)), 0.6) + 0.08 * Math.sin(u * 2.7);
    case 'mesa': return 0.28 + (Math.sin(u * 0.7) > 0.35 ? 0.38 : 0) + 0.04 * Math.sin(u * 5);
    case 'jagged': case 'volcanic': return 0.25 + 0.6 * tri(u * 1.1) * (0.6 + 0.4 * Math.sin(u * 0.37)) + 0.08 * tri(u * 4.3);
    case 'spires': return 0.25 + 0.65 * Math.pow(Math.max(0, Math.sin(u * 1.7)), 6) + 0.25 * Math.pow(Math.max(0, Math.sin(u * 0.6 + 1)), 3);
    default: return 0.55 + 0.25 * Math.sin(u * 1.3) + 0.2 * Math.sin(u * 3.1 + 2);
  }
}

function drawSky(e, alt, dt) {
  const g = ctx;
  const k = clamp((alt - 600) / 9000, 0, 1); // altitude: fade toward space
  const top = mixA(envMix(e, 'skyTop'), [2, 4, 15], k), bot = mixA(envMix(e, 'skyBot'), [26, 35, 80], k * 0.9);
  const sky = g.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, css(top)); sky.addColorStop(1, css(bot));
  g.fillStyle = sky; g.fillRect(0, 0, W, H);

  // stars
  const starA = clamp(Math.max(envNum(e, 'stars'), k * 1.3), 0, 1);
  if (starA > 0.02) {
    const span = W + 100, drift = (camX * 0.25) % span;
    for (const s of STARS) {
      const sx = ((s.x * span - drift) % span + span) % span - 50, sy = s.y * H * 0.9 + camOff * 0.03;
      const a = starA * (0.55 + 0.45 * Math.sin(time * 1.8 + s.tw));
      g.fillStyle = css(s.c, a); g.beginPath(); g.arc(sx, sy, s.r, 0, 7); g.fill();
      if (s.r > 1.5) { g.fillStyle = css(s.c, a * 0.25); g.fillRect(sx - s.r * 3, sy - 0.5, s.r * 6, 1); g.fillRect(sx - 0.5, sy - s.r * 3, 1, s.r * 6); }
    }
    if (!shooting && starA > 0.4 && Math.random() < dt * 0.25) shooting = { x: Math.random() * W, y: Math.random() * H * 0.4, life: 1 };
    if (shooting) {
      shooting.life -= dt * 1.5; const l = 1 - shooting.life;
      const x = shooting.x + l * 260, y = shooting.y + l * 110;
      const gr = g.createLinearGradient(x, y, x - 90, y - 38); gr.addColorStop(0, `rgba(255,255,255,${starA * shooting.life})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.strokeStyle = gr; g.lineWidth = 1.6; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 90, y - 38); g.stroke();
      if (shooting.life <= 0) shooting = null;
    }
  }

  // aurora
  const aur = envFlag(e, 'aurora') * (1 - k * 0.5);
  if (aur > 0.02) {
    for (let r = 0; r < 3; r++) {
      const base = H * (0.14 + r * 0.07) + camOff * 0.02;
      const gr = g.createLinearGradient(0, base - 30, 0, base + 90);
      const c = r === 1 ? '120,160,255' : '90,255,170';
      gr.addColorStop(0, `rgba(${c},0)`); gr.addColorStop(0.3, `rgba(${c},${0.28 * aur})`); gr.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = gr; g.beginPath(); g.moveTo(0, base + 90);
      for (let x = 0; x <= W + 20; x += 20) g.lineTo(x, base + Math.sin(x * 0.006 + time * 0.35 + r * 2) * 28 + Math.sin(x * 0.017 - time * 0.5) * 10);
      for (let x = W + 20; x >= 0; x -= 20) g.lineTo(x, base + 90 + Math.sin(x * 0.006 + time * 0.35 + r * 2) * 28);
      g.fill();
    }
  }

  // sun / moon / planet
  const orb = (o, a) => {
    if (!o || a <= 0.01) return;
    const x = W * 0.8, y = H * o.y + camOff * 0.02;
    const glow = g.createRadialGradient(x, y, o.r * 0.4, x, y, o.r * 3.2);
    glow.addColorStop(0, css(rgb(o.c), 0.55 * a)); glow.addColorStop(1, css(rgb(o.c), 0));
    g.fillStyle = glow; g.beginPath(); g.arc(x, y, o.r * 3.2, 0, 7); g.fill();
    g.fillStyle = css(rgb(o.c), a); g.beginPath(); g.arc(x, y, o.r, 0, 7); g.fill();
  };
  orb(e.a.sun, 1 - e.t); if (e.b !== e.a) orb(e.b.sun, e.t);
  orb(e.a.moon, 1 - e.t); if (e.b !== e.a) orb(e.b.moon, e.t);
  if (e.a.moon && e.t < 0.9) { const x = W * 0.8, y = H * e.a.moon.y + camOff * 0.02; g.fillStyle = css(top, 0.9 * (1 - e.t)); g.beginPath(); g.arc(x + 8, y - 5, e.a.moon.r * 0.85, 0, 7); g.fill(); } // crescent
  const pl = envFlag(e, 'planet');
  if (pl > 0.02) {
    const x = W * 0.74, y = H * 0.2 + camOff * 0.02, r = Math.min(W, H) * 0.09;
    const pg = g.createRadialGradient(x - r * 0.4, y - r * 0.4, r * 0.1, x, y, r);
    pg.addColorStop(0, `rgba(255,190,240,${pl})`); pg.addColorStop(1, `rgba(120,60,170,${pl})`);
    g.fillStyle = pg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
    g.strokeStyle = `rgba(255,220,250,${0.6 * pl})`; g.lineWidth = 3; g.beginPath(); g.ellipse(x, y, r * 1.7, r * 0.35, -0.3, 0, 7); g.stroke();
    g.fillStyle = `rgba(210,240,255,${pl})`; g.beginPath(); g.arc(W * 0.3, H * 0.12 + camOff * 0.02, r * 0.28, 0, 7); g.fill();
  }
}

function drawHills(e, gy) {
  const g = ctx, style = e.t < 0.5 ? e.a.style : e.b.style;
  const skyBot = envMix(e, 'skyBot');
  const layers = [
    { par: 3, hgt: Math.min(H * 0.26, 180), col: mixA(envMix(e, 'far'), skyBot, 0.35), st: style === 'dunes' ? 'mesa' : style, f: 0.8 },
    { par: 8, hgt: Math.min(H * 0.17, 115), col: envMix(e, 'hillB'), st: style, f: 1.3 },
    { par: 14, hgt: Math.min(H * 0.1, 70), col: envMix(e, 'hillA'), st: style === 'spires' || style === 'volcanic' ? 'jagged' : style, f: 2.2 },
  ];
  for (const L of layers) {
    const off = camX * L.par;
    const top = gy - L.hgt;
    let fill = css(L.col);
    if (L.st === 'jagged' && style === 'jagged') { // snow caps
      const gr = g.createLinearGradient(0, top - L.hgt * 0.1, 0, gy); gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.32, '#eef4fa'); gr.addColorStop(0.36, css(L.col)); gr.addColorStop(1, css(L.col)); fill = gr;

    for (let x = 0; x <= W + 16; x += 16) g.lineTo(x, gy - L.hgt * hillHeight(L.st, (x + off) * 0.004 * L.f));
    g.lineTo(W, gy); g.closePath(); g.fill();
    if (style === 'volcanic' && L.par === 3) { // volcano cones with glowing craters

        const period = 700, vx = k * period - (off % period) + 200, vh = L.hgt * 1.15;
        g.fillStyle = css(mixA(L.col, [20, 8, 8], 0.3)); poly(g, [[vx - 160, gy], [vx - 26, gy - vh], [vx + 26, gy - vh], [vx + 160, gy]]); g.fill();
        const gl = g.createRadialGradient(vx, gy - vh, 2, vx, gy - vh, 70);
        gl.addColorStop(0, `rgba(255,140,40,${0.7 + 0.2 * Math.sin(time * 3 + k)})`); gl.addColorStop(1, 'rgba(255,60,0,0)');
        g.fillStyle = gl; g.beginPath(); g.arc(vx, gy - vh, 70, 0, 7); g.fill();

function drawClouds(e) {

  const cover = envNum(e, 'cover'), col = envMix(e, 'cloud');
  const x0 = camX - W * 0.4 / camZ, x1 = camX + W / camZ;
  const yTop = (H * 0.78 + camOff) / camZ, yBot = (H * 0.78 + camOff - H) / camZ;
  const cx0 = Math.floor(x0 / cs), cx1 = Math.ceil(x1 / cs), cy0 = Math.max(1, Math.floor(yBot / vs)), cy1 = Math.min(40, Math.ceil(yTop / vs));
  if ((cx1 - cx0) * (cy1 - cy0) > 600) return;
  for (let cx = cx0; cx <= cx1; cx++) for (let cy = cy0; cy <= cy1; cy++) {
    const h = hash(cx * 73856093 ^ cy * 19349663);

    g.fillStyle = css(col, 0.9);

    g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.arc(sx - s * 0.2, sy - s * 0.35, s * 0.45, 0, 7); g.fill();
  }

function drawDeco(g, key, sx, gy, s, h, wx) {

      else if (h < 0.55) { const cs = ['#ffd23d', '#ff6fa8', '#fff', '#b58cff']; for (let i = 0; i < 4; i++) { g.fillStyle = cs[(i + (h * 100 | 0)) % 4]; g.beginPath(); g.arc(sx + i * s * 0.25, gy - 2 - (i % 2) * 2, Math.max(1.5, s * 0.08), 0, 7); g.fill(); } }

      else if (h < 0.34) { g.fillStyle = '#e9e2d0'; poly(g, [[sx - s * 0.3, gy], [sx - s * 0.18, gy - s * 2.2], [sx + s * 0.18, gy - s * 2.2], [sx + s * 0.3, gy]]); g.fill(); g.fillStyle = '#b8422f'; poly(g, [[sx - s * 0.25, gy - s * 2.2], [sx, gy - s * 2.55], [sx + s * 0.25, gy - s * 2.2]]); g.fill();
        g.strokeStyle = '#6a5a4a'; g.lineWidth = Math.max(1, s * 0.07); for (let i = 0; i < 4; i++) { const a = time * 1.5 + i * Math.PI / 2; g.beginPath(); g.moveTo(sx, gy - s * 2.1); g.lineTo(sx + Math.cos(a) * s * 1.1, gy - s * 2.1 + Math.sin(a) * s * 1.1); g.stroke(); } }
      else if (h < 0.5) { g.strokeStyle = '#6f8a2e'; g.lineWidth = 1.5; for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(sx + i * 4, gy); g.lineTo(sx + i * 4 + 1, gy - s * 0.35); g.stroke(); } }
      break;
    case 'desert':

      else if (h < 0.3) { g.fillStyle = '#b5824a'; g.beginPath(); g.ellipse(sx, gy - s * 0.15, s * 0.45, s * 0.28, 0, Math.PI, 0); g.fill(); }
      else if (h < 0.34) { g.strokeStyle = '#a8804a'; g.lineWidth = 1; const r = s * 0.3, bx = sx + ((time * 20 + wx) % 40); g.beginPath(); g.arc(bx, gy - r, r, 0, 7); g.arc(bx, gy - r, r * 0.6, 1, 5); g.stroke(); }

      else if (h < 0.38) { g.fillStyle = '#cfe6f2'; poly(g, [[sx - s * 0.5, gy], [sx - s * 0.2, gy - s * 0.6], [sx + s * 0.3, gy - s * 0.45], [sx + s * 0.5, gy]]); g.fill(); }
      else if (h < 0.4) { g.fillStyle = '#f4f8fb'; g.beginPath(); g.arc(sx, gy, s * 0.7, Math.PI, 0); g.fill(); g.fillStyle = '#9fb3c6'; g.beginPath(); g.arc(sx + s * 0.35, gy, s * 0.2, Math.PI, 0); g.fill(); }

}

function drawGround(gy) {
  const g = ctx;
  const xs0 = camX - W * 0.32 / camZ, xs1 = xs0 + W / camZ;
  const step = 16;
  for (let px = 0; px < W + step; px += step) {
    const e = envAt(xs0 + px / camZ);
    const top = envMix(e, 'ground'), dirt = envMix(e, 'dirt');
    g.fillStyle = css(dirt); g.fillRect(px, gy + 10, step + 1, H - gy);
    g.fillStyle = css(top); g.fillRect(px, gy, step + 1, 11);
    g.fillStyle = css(mixA(top, [255, 255, 255], 0.25)); g.fillRect(px, gy, step + 1, 2);
  }
  const shadeG = g.createLinearGradient(0, gy + 10, 0, H); shadeG.addColorStop(0, 'rgba(0,0,0,0)'); shadeG.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = shadeG; g.fillRect(0, gy + 10, W, H - gy);
  // decorations: cell size grows as we zoom out to keep the count sane
  let cell = 14; while (cell * camZ < 22) cell *= 2;
  for (let c = Math.floor(xs0 / cell) - 1; c <= Math.ceil(xs1 / cell) + 1; c++) {
    const h = hash(c * 2654435761 + cell);
    if (h > 0.6) continue;
    const wx = (c + hash(c + 99)) * cell; const [sx] = toScreen(wx, 0);
    const e = envAt(wx), key = hash(c * 7 + 3) < e.t ? e.b.key : e.a.key;
    const s = clamp(camZ * 3.2, 5, 26) * (0.75 + h);
    drawDeco(g, key, sx, gy, s, h, wx);
  }
  // distance markers
  let mstep = 10; const nice = [10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000];
  for (const n of nice) { mstep = n; if (n * camZ >= 140) break; }
  g.font = 'bold 12px system-ui, sans-serif'; g.textAlign = 'center';
  for (let m = Math.max(0, Math.floor(xs0 / mstep)) * mstep; m <= xs1; m += mstep) {
    if (m === 0) continue;
    const [sx] = toScreen(m, 0);
    g.fillStyle = 'rgba(255,255,255,.85)'; g.fillRect(sx - 1.5, gy - 22, 3, 22);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(sx - 24, gy - 38, 48, 16);
    g.fillStyle = '#fff'; g.fillText(fmtDist(m), sx, gy - 26);
  }
  if (save.best > 0) {
    const [sx] = toScreen(save.best, 0);
    if (sx > -50 && sx < W + 50) {
      g.fillStyle = '#fff'; g.fillRect(sx - 1.5, gy - 60, 3, 60);
      g.fillStyle = '#ffc233'; g.beginPath(); g.moveTo(sx + 1.5, gy - 60); g.lineTo(sx + 34, gy - 52); g.lineTo(sx + 1.5, gy - 44); g.fill();
      g.fillStyle = '#4a2a00'; g.font = 'bold 10px system-ui'; g.fillText('BEST', sx + 14, gy - 49);
    }
  }
  // launch ramp
  const [rx, ry] = toScreen(0, 0), s = camZ;
  if (rx > -400 && rx < W + 200) {
    g.strokeStyle = '#6b4526'; g.lineWidth = Math.max(1.5, s * 0.25);
    g.beginPath(); for (let i = 1; i <= 3; i++) { const x = rx - 8 * s + i * 2.2 * s; g.moveTo(x, ry); g.lineTo(x, ry - (i * 2.2 / 9) * 2.2 * s); } g.stroke();
    g.fillStyle = vgrad(g, ry - 2.2 * s, ry, '#d2955a', '#b77b47', '#8a5a34');
    poly(g, [[rx - 8 * s, ry], [rx + 1 * s, ry - 2.2 * s], [rx + 1 * s, ry - 2.2 * s + Math.max(2, .35 * s)], [rx - 8 * s, ry + Math.max(2, .35 * s)]]); g.fill();
  }
}

function drawWeather(e, dt, alt) {
  if (!save.settings.weather) return;
  const g = ctx, scale = world ? Math.min(world.scale, 8) : 1;
  const fade = clamp(1 - (alt - 250 * scale) / (500 * scale), 0, 1);
  if (fade <= 0) return;
  const move = P ? P.v * Math.cos(P.a) * camZ : 0; // our own motion streams the weather past
  const types = [e.a.weather, e.b.weather];
  const n = WX.length;
  for (let i = 0; i < n; i++) {
    const p = WX[i], type = (i / n) < e.t ? types[1] : types[0];
    if (p.s > WEATHER_DENSITY[type] * fade) continue;
    let vx = -move * 0.35, vy = 0;
    switch (type) {
      case 'rain': vx = vx * 0.5 - 140; vy = 760 + p.r * 200; break;
      case 'snow': vx = vx * 0.3 - 30 + Math.sin(time * 1.5 + p.r * 9) * 25; vy = 45 + p.r * 45; break;
      case 'dust': vx = vx * 0.8 - 380 - p.r * 200; vy = 15; break;
      case 'ash': vx = vx * 0.4 - 30; vy = p.r < 0.25 ? -60 - p.r * 80 : 40 + p.r * 30; break;
      case 'spores': vx = vx * 0.25 + Math.sin(time + p.r * 7) * 15; vy = -18 - p.r * 12; break;
      default: vx = vx * 0.2 + 12; vy = -6 + Math.sin(time + p.r * 5) * 8;
    }
    p.x = ((p.x + vx * dt) % (W + 40) + W + 40) % (W + 40); p.y = ((p.y + vy * dt) % (H + 40) + H + 40) % (H + 40);
    const x = p.x - 20, y = p.y - 20;
    switch (type) {
      case 'rain': g.strokeStyle = 'rgba(205,220,240,.5)'; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x - vx * 0.02, y - vy * 0.02); g.stroke(); break;
      case 'snow': g.fillStyle = 'rgba(255,255,255,.9)'; g.beginPath(); g.arc(x, y, 1.2 + p.r * 2.2, 0, 7); g.fill(); break;
      case 'dust': g.strokeStyle = `rgba(235,195,135,${0.22 + p.r * 0.2})`; g.lineWidth = 1.5 + p.r * 2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 30 + p.r * 50, y); g.stroke(); break;
      case 'ash':
        if (p.r < 0.25) { g.fillStyle = `rgba(255,${140 + (p.r * 400 | 0)},60,${0.6 + 0.4 * Math.sin(time * 8 + i)})`; g.fillRect(x, y, 2, 2); }
        else { g.fillStyle = 'rgba(70,64,64,.6)'; g.fillRect(x, y, 2.4, 1.6); }
        break;
      case 'spores': { const c = p.r < 0.5 ? '125,255,220' : '255,140,230'; const gr = g.createRadialGradient(x, y, 0, x, y, 5); gr.addColorStop(0, `rgba(${c},.9)`); gr.addColorStop(1, `rgba(${c},0)`); g.fillStyle = gr; g.beginPath(); g.arc(x, y, 5, 0, 7); g.fill(); break; }
      default: g.fillStyle = 'rgba(255,255,240,.55)'; g.beginPath(); g.arc(x, y, 1.3, 0, 7); g.fill();
    }
  }
  // lightning over the caldera
  const vol = (e.a.key === 'volcano' ? 1 - e.t : 0) + (e.b.key === 'volcano' ? e.t : 0);
  if (vol > 0.5 && Math.random() < dt * 0.18) { flash = 0.35; beep(60, 0.5, 'sawtooth', 0.03, -20); }
}

function drawScene(dt) {
  const g = ctx;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const alt = P ? Math.max(0, P.y) : 0;
  const e = envAt(camX);
  drawSky(e, alt, dt);
  if (shake > 0) { g.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake); shake = Math.max(0, shake - dt * 40); }
  const gy = H * 0.78 + camOff;
  if (gy - Math.min(H * 0.26, 180) < H) drawHills(e, gy);
  drawClouds(e);
  if (gy < H + 40) drawGround(gy);
  // plane shadow on the ground
  if (P && gy < H + 10) {
    const [sx] = toScreen(P.x, 0); const a = clamp(1 - P.y * camZ / 300, 0, 0.35);
    if (a > 0) { g.fillStyle = `rgba(0,0,0,${a})`; g.beginPath(); g.ellipse(sx, gy + 3, 34 * (1 - a), 5, 0, 0, 7); g.fill(); }
  }
  if (world && run) {
    const xs0 = camX - W * 0.32 / camZ - 20, xs1 = xs0 + W / camZ + 40;
    for (let i = Math.max(0, Math.floor(xs0 / world.CH)); i <= Math.floor(xs1 / world.CH); i++) {
      const items = world.chunk(i);
      for (let j = 0; j < items.length; j++) {
        if (run.taken.has(i * 64 + j)) continue;
        const it = items[j]; const [sx, sy] = toScreen(it.x, it.y);
        if (sx < -60 || sx > W + 60 || sy < -60 || sy > H + 60) continue;
        drawItem(g, it, sx, sy);
      }
    }
  }
  for (const p of particles) {
    const [sx, sy] = toScreen(p.x, p.y);
    g.globalAlpha = clamp(p.life, 0, 1); g.fillStyle = p.c; g.beginPath(); g.arc(sx, sy, p.r * (p.grow ? (2 - p.life) : 1), 0, 7); g.fill();
  }
  g.globalAlpha = 1;
  return e;
}

function drawOverlay(e, dt) {
  const g = ctx; g.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawWeather(e, dt, P ? Math.max(0, P.y) : 0);
  if (flash > 0) { g.fillStyle = `rgba(255,240,230,${flash})`; g.fillRect(0, 0, W, H); flash = Math.max(0, flash - dt * 1.4); }
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.max(W, H) * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,20,.28)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}

function drawItem(g, it, sx, sy) {
  const s = clamp(camZ * 1.6 * world.scale, 7, 14);
  if (it.k === 'coin') {
    const w = Math.abs(Math.sin(time * 4 + it.x * 0.1));
    g.fillStyle = '#b87a00'; g.beginPath(); g.ellipse(sx, sy, s * Math.max(.2, w), s, 0, 0, 7); g.fill();
    const cg = g.createLinearGradient(sx, sy - s, sx, sy + s); cg.addColorStop(0, '#fff2a8'); cg.addColorStop(0.5, '#ffd23d'); cg.addColorStop(1, '#e0a410');
    g.fillStyle = cg; g.beginPath(); g.ellipse(sx, sy, s * Math.max(.15, w) * .78, s * .78, 0, 0, 7); g.fill();
    if (w > 0.6) { g.fillStyle = 'rgba(255,255,255,.8)'; g.beginPath(); g.ellipse(sx - s * 0.2 * w, sy - s * 0.3, s * 0.12 * w, s * 0.25, 0, 0, 7); g.fill(); }
  } else if (it.k === 'ring') {
    g.save(); g.shadowColor = '#3ff0ff'; g.shadowBlur = 12;
    g.lineWidth = 5; g.strokeStyle = '#3ff0ff'; g.beginPath(); g.ellipse(sx, sy, s * 1.1, s * 3, 0, 0, 7); g.stroke(); g.restore();
    g.lineWidth = 2; g.strokeStyle = '#fff'; g.beginPath(); g.ellipse(sx, sy, s * 1.1, s * 3, 0, 0, 7); g.stroke();
  } else if (it.k === 'fuel') {
    g.fillStyle = vgrad(g, sy - s, sy + s, '#ff6a55', '#e8402f', '#a82a1e'); g.fillRect(sx - s * .8, sy - s, s * 1.6, s * 2);
    g.fillStyle = '#fff'; g.fillRect(sx - s * .5, sy - s * .2, s, s * .4);
    g.fillStyle = '#333'; g.fillRect(sx - s * .3, sy - s * 1.35, s * .6, s * .4);
  } else if (it.k === 'bird') {
    const f = Math.sin(time * 14 + it.ph) * s * .8;
    g.strokeStyle = '#2a2a2a'; g.lineWidth = 3; g.beginPath(); g.moveTo(sx - s * 1.3, sy - f); g.quadraticCurveTo(sx - s * .5, sy - s * .5, sx, sy); g.quadraticCurveTo(sx + s * .5, sy - s * .5, sx + s * 1.3, sy - f); g.stroke();
    g.fillStyle = '#f5a623'; poly(g, [[sx + 1, sy - 1], [sx + 5, sy], [sx + 1, sy + 1]]); g.fill();
  } else if (it.k === 'balloon') {
    const bob = Math.sin(time * 2 + it.ph) * 3, hue = Math.floor(it.hue * 360);
    g.strokeStyle = '#555'; g.lineWidth = 1; g.beginPath(); g.moveTo(sx, sy + s + bob); g.lineTo(sx, sy + s * 2.6 + bob); g.stroke();
    g.fillStyle = `hsl(${hue},80%,62%)`; g.beginPath(); g.ellipse(sx, sy + bob, s * .9, s * 1.15, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(sx - s * .3, sy - s * .4 + bob, s * .2, s * .3, 0, 0, 7); g.fill();
  }
}

function drawPlaneAt(x, y, a, scale) {
  const [sx, sy] = toScreen(x, y);
  ctx.save(); ctx.translate(sx, sy - 6 * scale); ctx.rotate(-a); ctx.scale(scale, scale);
  drawPlane(ctx, save.parts, { time, thrust: P && P.thrusting, reserveOn: P && P.reserveOn });
  ctx.restore();
}

function drawFloaters() {
  ctx.font = 'bold 16px system-ui, sans-serif'; ctx.textAlign = 'center';
  for (const f of floaters) {
    const [sx, sy] = toScreen(f.x, f.y);
    ctx.globalAlpha = clamp(f.life * 1.5, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillText(f.txt, sx + 1, sy - (1 - f.life) * 40 + 1);
    ctx.fillStyle = f.c; ctx.fillText(f.txt, sx, sy - (1 - f.life) * 40);
  }
  ctx.globalAlpha = 1;
}

function speedLines() {
  if (!P || P.v < 25 * world.scale) return;
  const n = Math.min(24, (P.v / (25 * world.scale) - 1) * 10);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
  for (let i = 0; i < n; i++) {
    const y = hash(i * 7 + Math.floor(time * 20)) * H, x = hash(i * 13 + Math.floor(time * 20)) * W;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 60, y + Math.sin(P.a) * 60); ctx.stroke();
  }
}

/* ---------- UI ---------- */
function showToast(t, color = '#fff') {
  const el = $('#toast'); el.textContent = t; el.style.color = color; el.classList.add('show');
  clearTimeout(showToast.h); showToast.h = setTimeout(() => el.classList.remove('show'), 1300);
}
let modalKind = null;
function openModal(html, kind = 'info') { modalKind = kind; $('#modal').innerHTML = html; $('#modalBg').classList.remove('hidden'); }
function closeModal() { modalKind = null; $('#modalBg').classList.add('hidden'); }
const modalOpen = () => !$('#modalBg').classList.contains('hidden');

function showArea(i) {
  if (!save.settings.titles) return;
  const b = BIOMES[i], isNew = !save.seen.includes(i);
  if (isNew) { save.seen.push(i); persist(); }
  $('#areaSub').textContent = isNew ? 'New area discovered' : '';
  $('#areaName').textContent = b.name;

  clearTimeout(showArea.h); showArea.h = setTimeout(() => el.classList.remove('show'), 3000);

function effText(id, st) {
  switch (id) {
    case 'frame':   return `Launch ${fmt(st.launch * 3.6)} km/h`;
    case 'wings':   return `Glide ×${(0.008 / st.drag).toFixed(2)}`;
    case 'engine':  return st.thrust > 0 ? `Top speed ${fmt(st.top * 3.6)} km/h` : 'No engine';
    case 'fuel':    return `${st.fuel.toFixed(1)} s burn`;
    case 'tail':    return `Turn rate ×${(st.pitch / 1.3).toFixed(2)}`;
    case 'nose':    return `Keep ${Math.round(st.armor * 100)}% speed on hits`;
    case 'magnet':  return `Coins ×${st.income.toFixed(2)} · reach ×${st.magnetR.toFixed(2)}`;
    case 'reserve': return st.reserve > 0 ? `${st.reserve.toFixed(1)} s · drain ${Math.round(st.drain)}%/s` : 'No reserve tank';
  }
}
const partLocked = id => PART[id].req && !PART[id].req(save.parts);

function renderHangar() {
  $('#coins').textContent = fmt(save.coins);
  $('#best').textContent = fmtDist(save.best);
  $('#soundBtn').textContent = save.sound ? '🔊' : '🔇';
  const fs = stageOf('frame', save.parts.frame);
  $('#planeName').textContent = LOOKS.frame[fs];
  const rating = PARTS.reduce((s, p) => s + save.parts[p.id], 0);
  $('#planeSub').textContent = `${FRAME_TAGS[fs]} · Build rating ${rating}`;
  const chips = $('#chips');
  if (!chips.children.length) {
    for (const p of PARTS) {
      const b = document.createElement('button'); b.className = 'chip'; b.dataset.id = p.id;
      b.innerHTML = `<span class="ic">${p.icon}</span><span class="nm">${p.name}</span><span class="lv"></span>`;
      b.addEventListener('click', () => { selPart = p.id; renderHangar(); });
      chips.appendChild(b);
    }
  }
  for (const b of chips.children) {
    const id = b.dataset.id, lvl = save.parts[id], P_ = PART[id], locked = partLocked(id);
    b.classList.toggle('sel', id === selPart);
    b.classList.toggle('locked', !!locked);
    b.classList.toggle('maxed', lvl >= P_.max);
    b.classList.toggle('afford', !locked && lvl < P_.max && save.coins >= partCost(id, lvl));
    b.querySelector('.lv').textContent = locked ? '🔒' : lvl >= P_.max ? 'MAX' : `Lv ${lvl}`;
  }
  // detail panel for the selected part
  const id = selPart, P_ = PART[id], lvl = save.parts[id], locked = partLocked(id);
  const st = curStats();
  $('#dIcon').textContent = P_.icon; $('#dName').textContent = P_.name; $('#dLv').textContent = `Lv ${lvl} / ${P_.max}`;
  const nextStageLv = Math.min(P_.max, (Math.floor(lvl / P_.step) + 1) * P_.step);
  let look = `Look: <b>${lookName(id, lvl)}</b>`;
  if (lvl === 0 && P_.install) look += ` · installs as <b>${LOOKS[id][0]}</b>`;
  else if (nextStageLv > lvl && stageOf(id, nextStageLv) !== stageOf(id, lvl)) look += ` · Lv ${nextStageLv}: ${LOOKS[id][stageOf(id, nextStageLv)]}`;
  $('#dLook').innerHTML = look;
  const btn = $('#upBtn');
  if (lvl >= P_.max) {
    $('#dEff').innerHTML = effText(id, st);
    btn.className = 'max'; btn.disabled = true; btn.textContent = 'MAXED OUT';
  } else {
    const nx = statsFor(Object.assign({}, save.parts, { [id]: lvl + 1 }));
    $('#dEff').innerHTML = `${effText(id, st)} → <b>${effText(id, nx)}</b>`;
    const c = partCost(id, lvl);
    btn.className = ''; btn.disabled = !!locked || save.coins < c;
    btn.innerHTML = locked ? `🔒 Needs ${P_.reqText}` : `${lvl === 0 && P_.install ? 'Install' : 'Upgrade'} · <span class="coin"></span> ${fmt(c)}`;
  }
  $('#dDesc').textContent = P_.desc;
}

let buyPulse = 0;
function buy(id) {
  const P_ = PART[id], lvl = save.parts[id];
  if (partLocked(id) || lvl >= P_.max) return;
  const c = partCost(id, lvl); if (save.coins < c) return;
  const before = stageOf(id, lvl);
  save.coins -= c; save.parts[id]++; persist();
  buyPulse = 1;
  if (lvl === 0 && P_.install) { sfx.fanfare(); showToast(`${P_.name} installed!`, '#ffe08a'); }
  else if (stageOf(id, lvl + 1) !== before) { sfx.fanfare(); showToast(`New look: ${LOOKS[id][stageOf(id, lvl + 1)]}!`, '#ffe08a'); }
  else sfx.buy();
  renderHangar();
}
$('#upBtn').addEventListener('click', () => buy(selPart));

function setMode(m) {
  mode = m;
  const flying = m === 'fly' || m === 'launch';
  $('#hangar').classList.toggle('hidden', m !== 'hangar');
  $('#topbar').classList.toggle('hidden', m !== 'hangar');
  $('#hud').classList.toggle('hidden', !(flying || m === 'done'));
  $('#flightBtns').classList.toggle('hidden', !flying);
  $('#launchUI').classList.toggle('hidden', m !== 'launch');
  $('#ctls').classList.toggle('hidden', m !== 'fly');
  if (m !== 'fly') { ctl.ptrs.clear(); ctl.keys.clear(); paintCtls(); }
  $('#hint').classList.add('hidden');
  if (m === 'hangar') { $('#areaTitle').classList.remove('show'); renderHangar(); }
}

$('#flyBtn').addEventListener('click', () => {
  audio(); newRun(); meterT = 0; paused = false; setMode('launch');
  $('#fuelWrap').classList.toggle('hidden', !(runSt.thrust > 0));
  $('#reserveWrap').classList.toggle('hidden', !(runSt.reserve > 0));

});
$('#soundBtn').addEventListener('click', () => { save.sound = !save.sound; persist(); renderHangar(); });
$('#menuBtn').addEventListener('click', openSettings);

/* settings toggles shared by the hangar settings and the pause menu */
const TOGGLES = [
  ['sound', 'Sound', () => save.sound, v => { save.sound = v; }],
  ['weather', 'Weather effects', () => save.settings.weather, v => { save.settings.weather = v; }],
  ['titles', 'Area titles', () => save.settings.titles, v => { save.settings.titles = v; }],
];
const togglesHtml = () => `<div class="toggles">${TOGGLES.map(([k, label, get]) => `<button class="toggle${get() ? ' on' : ''}" data-k="${k}"><span>${label}</span><span class="sw"></span></button>`).join('')}</div>`;
function wireToggles() {
  document.querySelectorAll('.toggle').forEach(b => b.addEventListener('click', () => {
    const t = TOGGLES.find(x => x[0] === b.dataset.k); t[3](!t[2]()); b.classList.toggle('on', t[2]()); persist();
    if (mode === 'hangar') renderHangar();
  }));
}

function openSettings() {
  openModal(`<h2>Settings</h2>
    ${togglesHtml()}
    <p style="margin-top:12px">Everything runs offline in your browser. Progress is saved automatically on this device.</p>
    <div class="btns">
      <button id="expBtn">Export save (backup)</button>
      <button id="impBtn">Import save</button>
      <button id="rstBtn" class="danger">Reset all progress</button>
      <button id="clsBtn" class="primary">Close</button>
    </div>`, 'settings');
  wireToggles();
  $('#clsBtn').onclick = closeModal;
  $('#expBtn').onclick = () => {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(save))));
    openModal(`<h2>Your save code</h2><p>Copy this somewhere safe. Paste it into “Import save” to restore.</p>
      <textarea readonly id="codeBox">${code}</textarea><div class="btns"><button id="cpBtn">Copy</button><button class="primary" id="clsBtn">Done</button></div>`);
    const box = $('#codeBox'); box.addEventListener('focus', () => box.select());
    $('#cpBtn').onclick = () => { box.select(); (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).catch(() => document.execCommand('copy')); $('#cpBtn').textContent = 'Copied!'; };
    $('#clsBtn').onclick = closeModal;
  };
  $('#impBtn').onclick = () => {
    openModal(`<h2>Import save</h2><p>Paste a save code (from any version). This replaces your current progress.</p>
      <textarea id="codeBox" placeholder="Paste code here"></textarea><div class="btns"><button class="primary" id="okBtn">Import</button><button id="clsBtn">Cancel</button></div>`);
    $('#clsBtn').onclick = closeModal;
    $('#okBtn').onclick = () => {
      try {
        const txt = $('#codeBox').value.trim();
        const raw = JSON.parse(txt.startsWith('{') ? txt : decodeURIComponent(escape(atob(txt))));
        if (typeof raw.coins !== 'number') throw 0;
        save = migrateSave(raw); persist();
        closeModal(); renderHangar(); showToast('Save imported!');
      } catch (e) { $('#okBtn').textContent = 'Invalid code — try again'; }
    };
  };
  $('#rstBtn').onclick = () => {
    openModal(`<h2>Reset everything?</h2><p>All coins and parts will be lost. This can’t be undone.</p>
      <div class="btns"><button class="danger" id="yesBtn">Yes, reset</button><button class="primary" id="clsBtn">Cancel</button></div>`);
    $('#clsBtn').onclick = closeModal;
    $('#yesBtn').onclick = () => { save = defaultSave(); persist(); selPart = 'frame'; closeModal(); renderHangar(); };
  };
}

function updateHud() {
  $('#hudDist').textContent = fmtDist(P.x);
  $('#hudAlt').textContent = fmtDist(Math.max(0, P.y));
  $('#hudSpd').textContent = fmt(P.v * 3.6) + ' km/h';
  $('#hudCoins').textContent = fmt(run.coins);
  if (runSt.thrust > 0) $('#fuelBar').style.width = clamp(P.fuel / runSt.fuel * 100, 0, 100) + '%';
  if (runSt.reserve > 0) {
    $('#reserveBar').style.width = clamp(P.reserve / runSt.reserve * 100, 0, 100) + '%';
    const ready = P.fuel <= 0 && P.reserve > 0 && !P.grounded;
    $('#reserveWrap').classList.toggle('on', P.reserveOn);
    const b = $('#ctlRes'); b.classList.toggle('ready', ready); b.classList.toggle('active', P.reserveOn);
    $('#resTxt').textContent = P.reserve > 0 ? (P.fuel > 0 ? 'after main fuel' : `${Math.max(0, P.reserve).toFixed(1)} s · SPACE`) : 'EMPTY';
    if (ready && !run.reserveToast && mode === 'fly') { run.reserveToast = true; showToast('RESERVE READY — hold SPACE', '#7de8ff'); }
  }
}

/* ---------- ending a run: landing, or quitting early ---------- */
function runEarnings() {
  const dist = P.x;
  const distCoins = Math.floor(dist * 0.5 * runSt.income);
  let msBonus = 0, ms = save.ms; const hit = [];
  while (ms < MILESTONES.length && dist >= MILESTONES[ms]) { msBonus += Math.ceil(MILESTONES[ms] * 0.5); hit.push(MILESTONES[ms]); ms++; }
  return { dist, distCoins, coins: run.coins, msBonus, hit, ms, total: distCoins + run.coins + msBonus };
}
function bank(e) {
  const newBest = e.dist > save.best;
  save.coins += e.total; save.ms = e.ms; save.runs++;
  if (newBest) save.best = e.dist;
  save.bestAlt = Math.max(save.bestAlt, P.maxY);
  persist();
  return newBest;
}
function finishRun() {
  setMode('done');
  const e = runEarnings(), newBest = bank(e);
  openModal(`<h2>${P.crashed ? 'Crash landing!' : 'Landed!'}</h2>
    ${newBest ? '<div class="nb">🏆 NEW BEST DISTANCE!</div>' : ''}
    <div class="row"><span>Distance</span><b>${fmtDist(e.dist)}</b></div>
    <div class="row"><span>Max altitude</span><b>${fmtDist(P.maxY)}</b></div>
    <div class="row"><span>Top speed</span><b>${fmt(P.maxV * 3.6)} km/h</b></div>
    <div class="row"><span>Distance reward</span><b><span class="coin"></span> ${fmt(e.distCoins)}</b></div>
    <div class="row"><span>Coins collected</span><b><span class="coin"></span> ${fmt(e.coins)}</b></div>
    ${e.msBonus ? `<div class="row"><span>Milestone ${e.hit.map(fmtDist).join(', ')}</span><b><span class="coin"></span> ${fmt(e.msBonus)}</b></div>` : ''}
    <div class="total"><span class="coin"></span> +${fmt(e.total)}</div>
    <div class="btns"><button class="primary" id="colBtn">Collect</button></div>`, 'result');
  $('#colBtn').onclick = () => { closeModal(); setMode('hangar'); };
  if (e.hit.length) sfx.fanfare();
}

function pauseGame() {
  if (!(mode === 'fly' || mode === 'launch') || paused) return;
  paused = true; ctl.keys.clear(); ctl.ptrs.clear(); paintCtls();
  $('#areaTitle').classList.remove('show');
  openPause();
}
function openPause() {
  paused = true;
  const e = runEarnings();
  openModal(`<h2>Paused</h2>
    <div class="row"><span>Distance so far</span><b>${fmtDist(e.dist)}</b></div>
    <div class="row"><span>Yours if you quit now</span><b><span class="coin"></span> ${fmt(e.total)}</b></div>
    ${togglesHtml()}
    <div class="btns"><button class="primary" id="resBtn">Resume</button><button class="danger" id="exitBtn">Exit to hangar</button></div>`, 'pause');
  wireToggles();
  $('#resBtn').onclick = resumeGame;
  $('#exitBtn').onclick = () => confirmQuit(openPause);
}
function resumeGame() { closeModal(); paused = false; lastT = performance.now(); }
function confirmQuit(back) {
  if (!(mode === 'fly' || mode === 'launch')) return;
  $('#areaTitle').classList.remove('show');
  paused = true; ctl.keys.clear(); ctl.ptrs.clear(); paintCtls();
  const e = runEarnings();
  openModal(`<h2>Do you want to quit?</h2>
    <p>You’ll leave now and keep everything earned so far.</p>
    <div class="total"><span class="coin"></span> +${fmt(e.total)}</div>
    <div class="btns"><button class="danger" id="yesQuit">Yes, quit</button><button class="primary" id="noQuit">No, keep flying</button></div>`, 'quit');
  $('#yesQuit').onclick = quitRun;
  $('#noQuit').onclick = () => back ? back() : resumeGame();
  confirmQuit.back = back;
}
function quitRun() {
  const e = runEarnings(), newBest = bank(e);
  closeModal(); paused = false; setMode('hangar');
  showToast(e.total > 0 ? `+${fmt(e.total)} coins banked${newBest ? ' · new best!' : ''}` : 'Flight abandoned', '#ffe08a');
}
$('#pauseBtn').addEventListener('click', pauseGame);
$('#quitBtn').addEventListener('click', () => confirmQuit(null));
document.addEventListener('visibilitychange', () => { if (document.hidden) { persist(); if (mode === 'fly' && !paused) pauseGame(); } });

/* ---------- input ---------- */
// Touch/mouse: the ▲ / ▼ / RESERVE pads do what they say; tapping anywhere else climbs.
// Keyboard: ↑/W climb, ↓/S dive, Space = reserve tank once you have one (climbs before that), Esc/P pause.
function paintCtls() { document.querySelectorAll('.ctl').forEach(el => el.classList.toggle('active', ctlOn(el.dataset.role))); }
addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('button, .modal, textarea')) return;
  audio();
  if (paused) return;
  if (mode === 'launch') { doLaunch(); return; }
  if (mode !== 'fly') return;
  const pad = e.target.closest && e.target.closest('.ctl');
  ctl.ptrs.set(e.pointerId, pad ? pad.dataset.role : 'up'); paintCtls();
});
const lift = e => { ctl.ptrs.delete(e.pointerId); paintCtls(); };
addEventListener('pointerup', lift);
addEventListener('pointercancel', lift);
addEventListener('blur', () => { ctl.ptrs.clear(); ctl.keys.clear(); paintCtls(); });
function keyRole(code) {
  if (code === 'ArrowUp' || code === 'KeyW') return 'up';
  if (code === 'ArrowDown' || code === 'KeyS') return 'down';
  if (code === 'Space') return save.parts.reserve > 0 ? 'reserve' : 'up';
  return null;
}
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('textarea')) return;
  if (e.code === 'Escape' || e.code === 'KeyP') {
    e.preventDefault();
    if (mode === 'fly' || mode === 'launch') {
      if (!paused) pauseGame();
      else if (modalKind === 'pause') resumeGame();
      else if (modalKind === 'quit') (confirmQuit.back || resumeGame)();
    } else if (modalOpen() && modalKind !== 'result') closeModal();
    return;
  }
  if (mode === 'hangar' && !modalOpen()) {
    const ids = PARTS.map(p => p.id), i = ids.indexOf(selPart);
    if (e.code === 'ArrowRight') { selPart = ids[(i + 1) % ids.length]; renderHangar(); return; }
    if (e.code === 'ArrowLeft') { selPart = ids[(i + ids.length - 1) % ids.length]; renderHangar(); return; }
    if (e.code === 'KeyU' || e.code === 'Equal' || e.code === 'NumpadAdd') { buy(selPart); return; }
  }
  const role = keyRole(e.code);
  if (!role && e.code !== 'Enter') return;
  e.preventDefault();
  if (e.repeat) return;
  if (mode === 'hangar') { if (!modalOpen() && (e.code === 'Space' || e.code === 'Enter')) $('#flyBtn').click(); return; }
  if (mode === 'done') { if (modalOpen() && $('#colBtn') && (e.code === 'Space' || e.code === 'Enter')) $('#colBtn').click(); return; }
  if (paused) return;
  if (mode === 'launch') { audio(); doLaunch(); return; }
  if (mode === 'fly' && role) { ctl.keys.add(role); paintCtls(); }
});
addEventListener('keyup', e => { const role = keyRole(e.code); if (role) { ctl.keys.delete(role); paintCtls(); } });
addEventListener('contextmenu', e => e.preventDefault());

function meterValue() { const p = (meterT * 0.9) % 2; return p < 1 ? p : 2 - p; }
function doLaunch() {
  const m = meterValue();
  const perfect = m >= 0.85;
  run.power = perfect ? 1.1 : 0.55 + 0.4 * (m / 0.85);
  P.v = runSt.launch * run.power;
  sfx.launch();
  if (perfect) { sfx.perfect(); showToast('PERFECT LAUNCH!', '#8dff9a'); }
  else if (m > 0.6) showToast('Good!', '#fff');
  setMode('fly');
  run.area = 0; setTimeout(() => { if (mode === 'fly' && run.area === 0) showArea(0); }, 700);
  if (!save.tipSeen || !save.tip2Seen) { $('#hint').textContent = 'Hold ▲ to climb · ▼ to dive'; $('#hint').classList.remove('hidden'); run.hintT = 4; }
}

/* ---------- main loop ---------- */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (!paused) time += dt;

  if (mode === 'hangar') drawHangar(dt);
  else {
    if (!paused) {
      if (mode === 'launch') meterT += dt;
      if (mode === 'fly') {
        const sub = Math.ceil(dt / (1 / 120));
        for (let i = 0; i < sub; i++) physStep(dt / sub);
        run.t += dt;
        if (run.hintT > 0) { run.hintT -= dt; if (run.hintT <= 0) { $('#hint').classList.add('hidden'); save.tipSeen = save.tip2Seen = true; } }
        if (P.thrusting && Math.random() < 0.8) particles.push({ x: P.x - Math.cos(P.a) * 3 * world.scale, y: P.y + 0.3, vx: -P.v * 0.1, vy: 0.5, life: 1, c: P.reserveOn ? 'rgba(125,232,255,.8)' : 'rgba(230,230,230,.7)', r: 4, grow: true });
        if (P.grounded && P.stopT > 0.6) finishRun();
        if (P.grounded && P.v > 1 && Math.random() < 0.5) particles.push({ x: P.x, y: 0.2, vx: -2, vy: 2, life: 0.8, c: '#a7875f', r: 3 });
        if (run.t > 300 && !P.grounded) { P.grounded = true; P.v = 0; P.y = 0; } // safety net
        const area = biomeIndex(P.x);
        if (area > run.area) { run.area = area; showArea(area); }
      }
      for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 9.8 * dt * 0.3; p.life -= dt * 1.2; }
      particles = particles.filter(p => p.life > 0).slice(-250);
      for (const f of floaters) f.life -= dt * 1.1;
      floaters = floaters.filter(f => f.life > 0);
      const targetZ = clamp(Math.min(W, H * 1.6) / (55 + P.v * 2.4), 0.12, 12);
      camZ = lerp(camZ, targetZ, 1 - Math.exp(-dt * 2.5));
      camX = P.x;
      camOff = Math.max(0, P.y * camZ - H * 0.38);
    }
    const e = drawScene(paused ? 0 : dt);
    const ps = clamp(0.8 + camZ * 0.03, 0.85, 1.1);
    drawPlaneAt(P.x, P.y, P.a, ps);
    drawFloaters();
    if (!paused) speedLines();
    drawOverlay(e, paused ? 0 : dt);
    if (mode === 'launch') $('#needle').style.left = (meterValue() * 100) + '%';
    updateHud();
  }
  requestAnimationFrame(frame);
}

function drawHangar(dt) {
  hangarT += dt;
  if (!world) world = makeWorld(curStats());
  camZ = clamp(Math.min(W, H) / 70, 4, 12); camX = -4; camOff = H * 0.12;
  P = null;
  const e = drawScene(dt);
  // fit the plane into the free space between the top bar and the upgrade panel
  const top = 56, bottom = Math.max(top + 60, $('#planeTitle').getBoundingClientRect().top - 6);
  const base = Math.min(clamp(Math.min(W, H) / 280, 1.2, 2.5), (bottom - top) / 72);
  const s = base * (1 + buyPulse * 0.08);
  buyPulse = Math.max(0, buyPulse - dt * 2);
  const cx = W / 2 + 10 * s, cy = Math.min(H * 0.34, (top + bottom) / 2) + Math.sin(hangarT * 2) * 6 * Math.min(1, s);
  const gl = ctx.createRadialGradient(cx, cy, 10, cx, cy, 90 * s);
  gl.addColorStop(0, 'rgba(255,255,255,.4)'); gl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(cx, cy, 90 * s, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(hangarT * 1.3) * 0.04 - 0.05); ctx.scale(s, s);
  drawPlane(ctx, save.parts, { time: hangarT, thrust: save.parts.engine > 0, hl: selPart });
  ctx.restore();
  if (buyPulse > 0.5) { ctx.fillStyle = `rgba(255,255,255,${(buyPulse - 0.5) * 0.5})`; ctx.fillRect(0, 0, W, H); }
  drawOverlay(e, dt);
}

/* ---------- offline earnings ---------- */
function offlineEarnings() {
  const away = (Date.now() - (save.last || Date.now())) / 60000; // minutes
  if (away < 2 || save.runs === 0) return;
  const mins = Math.min(away, 240);
  const rate = Math.max(1, 0.15 * Math.pow(3.2, corePower() / 5) * curStats().income);
  const earn = Math.floor(rate * mins);
  if (earn <= 0) return;
  save.coins += earn; persist();
  openModal(`<h2>Welcome back!</h2>
    <p>Your hangar crew polished planes while you were away${away > 240 ? ' (up to 4 hours counts)' : ''}.</p>
    <div class="total"><span class="coin"></span> +${fmt(earn)}</div>
    <div class="btns"><button class="primary" id="clsBtn">Nice</button></div>`);
  $('#clsBtn').onclick = () => { closeModal(); renderHangar(); };
}

// start on the cheapest thing you can afford, so the next step is obvious
(function pickStartPart() {
  const ok = PARTS.filter(p => !partLocked(p.id) && save.parts[p.id] < p.max);
  ok.sort((a, b) => partCost(a.id, save.parts[a.id]) - partCost(b.id, save.parts[b.id]));
  if (ok.length) selPart = ok[0].id;
})();
setMode('hangar');
offlineEarnings();
persist();
requestAnimationFrame(frame);

/* ---------- offline install (PWA) ---------- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
